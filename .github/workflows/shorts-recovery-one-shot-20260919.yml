name: One-Time Global Short After Recovery

on:
  push:
    paths:
      - 'shorts_bot/one_shot_recovery_20260919.txt'

permissions:
  contents: write

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  publish-one-quality-checked-short:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: public
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_FALLBACK_MODELS: gemini-3.5-flash,gemini-3.6-flash
      TTS_VOICE: am_michael
      SHORTS_THEME: everyday
      SHORTS_AI_REVIEW: '1'
      SHORTS_TREND_MODE: 'off'
      SHORTS_US_TRENDS: '0'
      SHORTS_MAX_VISUAL_CANDIDATES: '9'
      SHORTS_MUSIC: '1'
      SHORTS_MUSIC_GAIN: '0.20'
      SHORTS_SKIP_UPLOAD: '0'
    steps:
      - name: Checkout production bot
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install speech and video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r shorts_bot/requirements.txt
          pip check
      - name: Verify full production syntax
        run: |
          python -m py_compile shorts_bot/main.py shorts_bot/upgrade.py shorts_bot/editorial_upgrade.py shorts_bot/quality_entry.py shorts_bot/selection_guard.py shorts_bot/visual_guard.py shorts_bot/live_action_guard.py shorts_bot/creator_guard.py shorts_bot/resilient_plan_guard.py shorts_bot/stock_recovery.py shorts_bot/hd_footage_guard.py shorts_bot/montage_entry.py
      - name: Make one original wave Short and publish only after complete verification
        run: |
          PYTHONPATH=shorts_bot python - <<'PY'
          import us_trends
          import editorial_upgrade
          # Describe only moments visibly available in genuine Pexels beach footage.
          us_trends._evergreen = lambda theme: 'how ocean waves roll onto the shore'
          editorial_upgrade.POLICY += '''
          ONE-OFF VISUAL FEASIBILITY: Tell an original accurate accessible
          English micro-story about an ocean wave rolling toward the shore,
          visible white foam, and waves continuing to arrive. This is a
          VISUAL-FIRST story: choose eight distinct broad observations which
          genuine portrait real-camera footage of ocean surf or beach waves
          can demonstrate. Describe wave movement, breaking and shore foam
          only where those actions are available as filmed scenes; otherwise
          describe an equally truthful visible wave observation. Do NOT demand
          a curled overhanging crest, a slow-motion barrel, an underwater
          view, rocky cliffs, a particular beach, precisely measured physics,
          sand visibly moving underwater, a swimmer, or a specific wave shape.
          Do not assert all eight shots show sand if they need not. Each shot
          must visibly support its own narration; do not pass off boat wakes,
          cliffs or calm flat water as shoreline breakers. Use three distinct
          but broad exact stock search phrases per scene, such as ocean waves,
          beach waves, shore foam, ocean surf, waves breaking, waves coastline,
          waves beach closeup, wave movement; vary actual observations and
          shots, not merely captions over recycled footage. Eight DIFFERENT
          Pexels clips with no matching visual fingerprints are mandatory.
          Start with an engaging true hook and finish with a natural concise
          subscription invitation; no external URL, AI promotion or hashtag.
          '''
          import montage_entry
          montage_entry.main()
          PY
      - name: Retain output for review three days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requested-recovery-short-${{ github.run_id }}
          path: |
            shorts_bot/output/short.mp4
            shorts_bot/output/plan.json
            shorts_bot/output/visual_sources.json
          if-no-files-found: ignore
          retention-days: 3
