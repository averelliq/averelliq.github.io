name: Global Shorts Bot

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. These are 08:15, 16:15 and 00:15 in Türkiye (UTC+3).
    - cron: "15 5 * * *"
    - cron: "15 13 * * *"
    - cron: "15 21 * * *"

permissions:
  contents: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  create-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: private
      GEMINI_MODEL: gemini-3.6-flash
      TTS_VOICE: am_michael

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt

      - name: Cache AI model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r shorts_bot/requirements.txt
          pip check

      - name: Preflight checks
        run: |
          python -m py_compile shorts_bot/main.py
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python - <<'PY'
          import requests, soundfile
          from kokoro import KPipeline
          print('Python imports OK')
          PY

      - name: Generate and upload Short
        run: python shorts_bot/main.py

      - name: Save generated Short for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-short-${{ github.run_id }}
          path: |
            shorts_bot/output/short.mp4
            shorts_bot/output/plan.json
          if-no-files-found: ignore
          retention-days: 3
