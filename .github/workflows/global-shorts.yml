name: Global Shorts Bot

on:
  workflow_dispatch:
    inputs:
      smoke_test:
        description: Generate a video without uploading to YouTube
        required: false
        type: boolean
        default: false
      theme:
        description: Choose a content format (auto cycles; scheduled runs have fixed themes)
        required: false
        type: choice
        options:
          - auto
          - science
          - history
          - everyday
        default: auto
  schedule:
    # UTC cron; Türkiye time: 08:15, 16:15, 00:15 (next calendar day).
    - cron: "15 5 * * *"
    - cron: "15 13 * * *"
    - cron: "15 21 * * *"

permissions:
  contents: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  create-short:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_DATA_API_KEY: ${{ secrets.YT_DATA_API_KEY }}
      YOUTUBE_PRIVACY: public
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_FALLBACK_MODELS: gemini-3.5-flash,gemini-3.6-flash
      TTS_VOICE: am_michael
      SHORTS_THEME: ${{ inputs.theme || 'auto' }}
      SHORTS_AI_REVIEW: '1'
      SHORTS_TREND_MODE: auto
      SHORTS_MAX_VISUAL_CANDIDATES: '9'
      SHORTS_MUSIC: '1'
      SHORTS_MUSIC_GAIN: '0.20'
      SHORTS_SKIP_UPLOAD: ${{ inputs.smoke_test == true && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt

      - name: Cache AI model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r shorts_bot/requirements.txt
          pip check

      - name: Preflight checks
        run: |
          python -m py_compile shorts_bot/main.py shorts_bot/retry_runner.py shorts_bot/upgrade.py shorts_bot/selection_guard.py shorts_bot/visual_guard.py shorts_bot/live_action_guard.py shorts_bot/trend_ideas.py shorts_bot/quality_entry.py shorts_bot/montage_fx.py shorts_bot/montage_entry.py
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python - <<'PY'
          import requests, soundfile, numpy
          from kokoro import KPipeline
          print('Python imports OK')
          PY

      - name: Generate, verify REAL live-action footage and upload enhanced Short
        run: python shorts_bot/montage_entry.py

      - name: Save generated Short for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-short-${{ github.run_id }}
          path: |
            shorts_bot/output/short.mp4
            shorts_bot/output/plan.json
            shorts_bot/output/visual_sources.json
          if-no-files-found: ignore
          retention-days: 3
