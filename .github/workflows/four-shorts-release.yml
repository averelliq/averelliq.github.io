name: Publish Reviewed Corrected CurioRush Shorts

on:
  push:
    paths:
      - 'shorts_bot/four_shorts_release.json'
  schedule:
    # Next calendar day after the Pacific-time YouTube daily quota reset.
    - cron: '20 8 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  publish-corrected:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      GH_TOKEN: ${{ github.token }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - name: Checkout fingerprint-pinned review approval
        uses: actions/checkout@v4
      - name: Download exact corrected four review artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: curiorush-six-*-35482613532
          run-id: 35482613532
          github-token: ${{ github.token }}
          path: shorts_bot/four_reviewed
          merge-multiple: false
      - name: Install verified upload dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install 'requests>=2.31,<3' 'google-api-python-client>=2.100,<3' 'google-auth>=2.20,<3'
          python -m pip check
          python -m py_compile shorts_bot/publish_corrected_four.py
      - name: Verify reviewed videos and upload only missing originals
        run: python -u shorts_bot/publish_corrected_four.py
      - name: Save verified URLs and upload status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-shorts-youtube-receipts-${{ github.run_id }}
          path: shorts_bot/four_reviewed/publication_receipts.json
          if-no-files-found: ignore
          retention-days: 30
