name: KAYIP FREKANS - V8 EDITOR REPAIR ONCE
on:
  push:
    paths:
      - .github/workflows/kayip-frekans-v8-editor-repair-once.yml
permissions:
  contents: write
jobs:
  repair-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply KF-only patch, test and commit if passed
        env:
          PYTHONPATH: kayip_frekans
        run: |
          python -m pip install Pillow==11.3.0
          python kayip_frekans/v8_editor_patch_once.py
          python -m py_compile kayip_frekans/mpt_story_recovery.py kayip_frekans/mpt_long_story.py kayip_frekans/mpt_web_story.py
          python -m unittest -v kayip_frekans/test_story_recovery.py kayip_frekans/test_web_story.py
          git diff --check
          git add kayip_frekans/mpt_story_recovery.py kayip_frekans/mpt_long_story.py kayip_frekans/test_story_recovery.py .github/workflows/kayip-frekans-mpt-long-serious.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve source-backed story on unverified editorial claims, bound retries and checkpoint chapters'
          git push origin HEAD:main
