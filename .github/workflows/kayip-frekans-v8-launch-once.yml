name: KAYIP FREKANS - V8 ONE TIME VIDEO LAUNCH
on:
  push:
    paths:
      - .github/workflows/kayip-frekans-v8-launch-once.yml
permissions:
  contents: read
  actions: write
jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Start one corrected 15-minute sourced horror review video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/kayip-frekans-mpt-long-serious.yml/dispatches'
          payload = {'ref': 'main', 'inputs': {
              'topic': 'Köyde yalnız kalan bir adam, ölen kardeşinin sesini kilitli dış kapıdan ve sonra evin içinden duyar. Eski aile eşyası, komşu tanıklığı ve önceden verilen ipuçları finalde birleşir. Kamu malı klasik korku eserinden Türkçe cinli uyarlama; gerçek yaşanmış olay diye sunulmaz.',
              'target_minutes': '15',
          }}
          req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), method='POST', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          })
          with urllib.request.urlopen(req, timeout=60) as response:
              assert response.status == 204, f'Dispatch status {response.status}'
          print('KAYIP FREKANS v8 dispatched once; YouTube upload disabled')
          PY
