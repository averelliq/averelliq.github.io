name: Pottery Short MP4 Preview

on:
  push:
    paths:
      - 'shorts_bot/pottery_preview_request.json'

permissions:
  contents: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  render-pottery:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TTS_VOICE: am_michael
      SHORTS_SKIP_UPLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install FFmpeg and voice dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
      - name: Install Python dependencies and verify preview lock
        run: |
          pip install -r shorts_bot/requirements.txt
          pip check
          python -m compileall -q shorts_bot
          python - <<'PY'
          import json, os
          from pathlib import Path
          request = json.loads(Path('shorts_bot/pottery_preview_request.json').read_text())
          assert request['topic'] == 'how a potter shapes a clay bowl on a wheel'
          assert request['preview_only'] is True
          assert os.environ['SHORTS_SKIP_UPLOAD'] == '1'
          assert os.environ['PEXELS_API_KEY']
          print('Pottery MP4 preview only; uploading disabled.', flush=True)
          PY
      - name: Find distinct HD pottery shots and render a preview for audiovisual review
        run: PYTHONPATH=shorts_bot python -u shorts_bot/pottery_preview_entry.py
      - name: Save the exact MP4, source manifest and 21 scene frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pottery-preview-${{ github.run_id }}
          path: |
            shorts_bot/output/short.mp4
            shorts_bot/output/plan.json
            shorts_bot/output/visual_sources.json
            shorts_bot/output/scene_*.jpg
            shorts_bot/output/manual_review_required.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
