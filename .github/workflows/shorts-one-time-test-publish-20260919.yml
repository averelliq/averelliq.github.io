name: One-Time Global Shorts Video Test

on:
  push:
    paths:
      - 'shorts_bot/one_time_video_test_20260919.txt'

permissions:
  contents: write

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  one-original-short:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_DATA_API_KEY: ${{ secrets.YT_DATA_API_KEY }}
      YOUTUBE_PRIVACY: public
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_FALLBACK_MODELS: gemini-3.5-flash,gemini-3.6-flash
      TTS_VOICE: am_michael
      SHORTS_THEME: everyday
      SHORTS_AI_REVIEW: '1'
      SHORTS_TREND_MODE: 'off'
      SHORTS_US_TRENDS: '0'
      SHORTS_MAX_VISUAL_CANDIDATES: '9'
      SHORTS_MUSIC: '1'
      SHORTS_MUSIC_GAIN: '0.20'
      SHORTS_SKIP_UPLOAD: '0'
    steps:
      - name: Checkout approved bot
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - name: Cache TTS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install FFmpeg and speech dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r shorts_bot/requirements.txt
          pip check
      - name: Validate production code
        run: |
          python -m py_compile shorts_bot/main.py shorts_bot/retry_runner.py shorts_bot/upgrade.py shorts_bot/editorial_upgrade.py shorts_bot/selection_guard.py shorts_bot/visual_guard.py shorts_bot/live_action_guard.py shorts_bot/trend_ideas.py shorts_bot/us_trends.py shorts_bot/us_window.py shorts_bot/quality_entry.py shorts_bot/montage_fx.py shorts_bot/montage_entry.py shorts_bot/gemini_transient_guard.py shorts_bot/creator_guard.py shorts_bot/hd_footage_guard.py
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Create original latte-art curiosity Short; upload only after full quality verification
        run: |
          PYTHONPATH=shorts_bot python - <<'PY'
          import us_trends
          import editorial_upgrade
          # One-off editorial topic backed by numerous genuine Pexels vertical clips.
          # All original-script, Full HD, real-camera, subject-match, narration,
          # factual consistency and anti-duplicate publication checks remain on.
          us_trends._evergreen = lambda theme: 'how a barista pours latte art into coffee'
          editorial_upgrade.POLICY += '''
          TEST-SPECIFIC VISUAL ACCURACY: Tell one truthful and specific story about
          a barista pouring steamed milk into espresso to form latte art. Structure
          eight distinct observations around the pour, movement of the milk and
          gradual appearance of white foam shapes in the cup. All eight visuals
          must be attainable using genuine vertical Pexels camera footage of
          latte art pouring; never demand unseen milk temperatures, espresso
          extraction, a particular cup color, a specific cafe location, or
          distinct shapes (hearts, swans) when generic footage cannot prove them.
          Stock search phrases can vary between: latte art pouring milk,
          barista making latte art, milk pouring into coffee, latte foam coffee,
          barista pouring latte, latte art close up, coffee milk pour,
          barista coffee art. Avoid queries describing an action or object
          missing from the narration. Each scene should truthfully describe
          an actual visible step of latte-art milk pouring. Keep it engaging,
          credible, and original, not eight interchangeable repetitions.
          '''
          import montage_entry
          montage_entry.main()
          PY
      - name: Retain video and plan for review (three days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requested-short-test-${{ github.run_id }}
          path: |
            shorts_bot/output/short.mp4
            shorts_bot/output/plan.json
            shorts_bot/output/visual_sources.json
          if-no-files-found: ignore
          retention-days: 3
