name: Gemini GenerateContent Probe (No Upload)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gemini-generation-probe-20260918.yml

permissions:
  contents: read

jobs:
  check-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Test tiny text response per advertised model; never print key
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          key=os.environ.get('GEMINI_API_KEY','').strip()
          assert key
          payload=json.dumps({'contents':[{'parts':[{'text':'Reply with exactly OK.'}]}], 'generationConfig':{'maxOutputTokens':24}}).encode()
          for model in ['gemini-3.5-flash-lite','gemini-3.5-flash','gemini-3.1-flash-lite','gemini-3-flash-preview','gemini-2.5-flash','gemini-flash-latest']:
              req=urllib.request.Request('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent',data=payload,headers={'x-goog-api-key':key,'Content-Type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=35) as resp:
                      obj=json.load(resp)
                      text=''.join(part.get('text','') for part in obj.get('candidates',[{}])[0].get('content',{}).get('parts',[]))
                      print('MODEL',model,'STATUS',resp.status,'REPLY',text[:70],flush=True)
              except urllib.error.HTTPError as exc:
                  detail=exc.read(900).decode('utf8','replace')
                  try: detail=json.loads(detail).get('error',{}).get('message','')
                  except Exception: detail='HTTP error'
                  print('MODEL',model,'STATUS',exc.code,'ERROR',detail[:210],flush=True)
              except Exception as exc:
                  print('MODEL',model,'EXCEPTION',type(exc).__name__,flush=True)
          PY
