name: One-Off Shorts Diagnostic MP4 (NO UPLOAD)

on:
  push:
    branches: [main]
    paths: [.github/workflows/shorts-render-diagnostic-once.yml]

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TTS_VOICE: am_michael
      SHORTS_SKIP_UPLOAD: '1'
      YOUTUBE_PRIVACY: private
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: full-smoke-short-35119187642
          run-id: 35119187642
          github-token: ${{ github.token }}
          path: diagnostic_input
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install render tools and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
          pip install -r shorts_bot/requirements.txt
          pip check
      - name: Render diagnostic from PREVIOUS script; stock vision gate explicitly disabled; NO UPLOAD
        shell: bash
        run: |
          test "$SHORTS_SKIP_UPLOAD" = 1
          test -z "${YT_CLIENT_ID:-}${YT_CLIENT_SECRET:-}${YT_REFRESH_TOKEN:-}"
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'shorts_bot')
          import upgrade
          original_stock = upgrade.matched_pexels_video
          original_build = upgrade.aligned_build_video
          import quality_entry  # Keep the subtitle and loudness fixes but DO NOT call its publishing path.
          upgrade.matched_pexels_video = original_stock
          upgrade.aligned_build_video = original_build
          plans = list(Path('diagnostic_input').rglob('plan.json'))
          if len(plans) != 1:
              raise SystemExit('Expected exactly one saved plan from the failed production smoke')
          plan = json.loads(plans[0].read_text(encoding='utf-8'))
          if not plan.get('scenes') or not plan.get('narration'):
              raise SystemExit('Saved script is incomplete')
          plan['diagnostic_only'] = ('VISION QUALITY GATES BYPASSED ONLY IN THIS UPLOAD-DISABLED TEST; '
                                     'visuals are NOT approved for publication')
          upgrade.CURRENT_PLAN = plan
          upgrade.bot.WORK.mkdir(parents=True, exist_ok=True)
          upgrade.bot.OUT.mkdir(parents=True, exist_ok=True)
          audio = upgrade.bot.WORK / 'voice.wav'
          upgrade.scene_tts(plan['narration'], audio)
          video = original_build(plan, audio)
          (upgrade.bot.OUT / 'plan.json').write_text(json.dumps(plan, indent=2, ensure_ascii=False), encoding='utf-8')
          print('DIAGNOSTIC MP4 ONLY:', video, 'No Gemini vision requests. No YouTube upload.')
          PY
      - name: Check diagnostic MP4
        run: |
          test -s shorts_bot/output/short.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 shorts_bot/output/short.mp4
      - name: Save diagnostic MP4 for independent viewing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-short-${{ github.run_id }}
          path: |
            shorts_bot/output/short.mp4
            shorts_bot/output/plan.json
            shorts_bot/output/visual_sources.json
            shorts_bot/work/captions.srt
          if-no-files-found: ignore
          retention-days: 5
