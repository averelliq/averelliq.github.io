name: One-Off Original Short

on:
  push:
    branches: [main]
    paths:
      - shorts_bot/one_off_request.json

permissions:
  contents: write

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  publish-one-off:
    if: github.repository == 'averelliq/averelliq.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_DATA_API_KEY: ${{ secrets.YT_DATA_API_KEY }}
      YOUTUBE_PRIVACY: public
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_FALLBACK_MODELS: gemini-3.5-flash,gemini-3.6-flash
      TTS_VOICE: am_michael
      SHORTS_THEME: everyday
      SHORTS_AI_REVIEW: '1'
      SHORTS_TREND_MODE: auto
      SHORTS_US_TRENDS: '0'
      SHORTS_MAX_VISUAL_CANDIDATES: '9'
      SHORTS_MUSIC: '1'
      SHORTS_MUSIC_GAIN: '0.20'
      SHORTS_SKIP_UPLOAD: '0'
      SHORTS_ONE_OFF_PUBLISH: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r shorts_bot/requirements.txt
          pip check
      - name: Preflight checks
        run: |
          python -m py_compile shorts_bot/one_off_entry.py shorts_bot/main.py shorts_bot/upgrade.py shorts_bot/quality_entry.py shorts_bot/montage_entry.py shorts_bot/creator_guard.py
          ffmpeg -version | head -n 1
          python - <<'PY'
          import requests, soundfile, numpy
          from kokoro import KPipeline
          print('One-off dependencies available')
          PY
      - name: Create, check originality and publish this requested Short
        run: python shorts_bot/one_off_entry.py
      - name: Preserve generated media and plan for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-off-short-${{ github.run_id }}
          path: |
            shorts_bot/output/short.mp4
            shorts_bot/output/plan.json
            shorts_bot/output/visual_sources.json
          if-no-files-found: ignore
          retention-days: 3
