name: One-Off Steel Gear Short

on:
  push:
    branches: [main]
    paths:
      - shorts_bot/gear_short_request.json
      - shorts_bot/gear_short_entry.py

permissions:
  contents: write

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  create-and-publish:
    if: github.repository == 'averelliq/averelliq.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_DATA_API_KEY: ${{ secrets.YT_DATA_API_KEY }}
      YOUTUBE_PRIVACY: public
      GEMINI_MODEL: gemini-3.6-flash
      GEMINI_FALLBACK_MODELS: gemini-3.5-flash,gemini-3.5-flash-lite
      TTS_VOICE: am_michael
      SHORTS_THEME: history
      SHORTS_AI_REVIEW: '1'
      SHORTS_TREND_MODE: auto
      SHORTS_US_TRENDS: '0'
      SHORTS_MAX_VISUAL_CANDIDATES: '9'
      SHORTS_MUSIC: '1'
      SHORTS_MUSIC_GAIN: '0.20'
      SHORTS_CTA: '1'
      SHORTS_SKIP_UPLOAD: '0'
      SHORTS_GEAR_ONE_OFF: '1'
      SHORTS_ONE_OFF_PUBLISH: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r shorts_bot/requirements.txt
          pip check
      - name: Validate code, model routing and reminder before production
        run: |
          python -m py_compile shorts_bot/retry_runner.py shorts_bot/footage_pool_fix.py shorts_bot/gear_short_entry.py shorts_bot/cta_overlay.py shorts_bot/montage_entry.py shorts_bot/process_formats.py
          PYTHONPATH=shorts_bot python - <<'PY'
          import tempfile
          from pathlib import Path
          from cta_overlay import add_reminder
          from retry_runner import _model_candidates
          with tempfile.TemporaryDirectory() as temp:
              path = Path(temp) / 'captions.ass'
              path.write_text('[V4+ Styles]\nStyle: Captions,DejaVu Sans\n[Events]\n', encoding='utf-8')
              start, end = add_reminder(path, 30.0)
              output = path.read_text(encoding='utf-8')
              assert 19 < start < 22 and end - start == 2.0
              assert 'Style: Reminder,' in output and 'LIKE  +  SUBSCRIBE' in output
          url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent'
          names = [name for name, _ in _model_candidates(url)]
          assert names == ['gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-3.5-flash-lite'], names
          print('CTA + fallback routing smoke tests passed')
          PY
          ffmpeg -version | head -n 1
      - name: Produce, verify and upload original steel gear Short
        run: python shorts_bot/gear_short_entry.py
      - name: Preserve MP4 and provenance for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steel-gear-short-${{ github.run_id }}
          path: |
            shorts_bot/output/short.mp4
            shorts_bot/output/plan.json
            shorts_bot/output/visual_sources.json
          if-no-files-found: ignore
          retention-days: 3
