name: Inspect Lightning Stock Filmed Candidates (No Upload)
on:
  push:
    paths:
      - .github/workflows/probe-octopus-real-stock-no-upload-20260918.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - name: Count portrait filmed lightning stock videos and scene candidates
        run: |
          pip install -q requests
          python - <<'PY'
          import os,requests
          key=os.environ['PEXELS_API_KEY']
          assert key
          queries=['lightning bolt storm night','lightning strike night sky','lightning thunderstorm clouds','lightning over city','lightning storm timelapse','thunderstorm lightning horizon','lightning flash sky','lightning storm clouds','lightning']
          all_ids=set()
          for query in queries:
              unique=set()
              for page in (1,2):
                  response=requests.get('https://api.pexels.com/v1/videos/search',headers={'Authorization':key},params={'query':query,'orientation':'portrait','per_page':30,'page':page,'locale':'en-US'},timeout=30)
                  print('REQUEST',repr(query),'PAGE',page,'STATUS',response.status_code,flush=True)
                  response.raise_for_status()
                  for v in response.json().get('videos',[]):
                      files=[f for f in v.get('video_files',[]) if (f.get('height') or 0)>(f.get('width') or 0) and (f.get('height') or 0)>=720]
                      slug=v.get('url','').rstrip('/').split('/')[-1]
                      if files and ('lightning' in slug or 'thunderstorm' in slug):
                          unique.add(v['id'])
                          all_ids.add(v['id'])
                          print('  REAL LIGHTNING CANDIDATE',v['id'],slug,flush=True)
              print('QUERY DISTINCT SUBJECT-MATCHING',repr(query),len(unique),flush=True)
          print('TOTAL DISTINCT LIGHTNING PORTRAIT',len(all_ids),'NO DOWNLOAD NO UPLOAD',flush=True)
          assert len(all_ids)>=5,'Fewer than 5 unique subject-matching portrait stock assets'
          PY
