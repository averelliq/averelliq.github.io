name: One-Off YouTube Trend Verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trend-live-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      YT_DATA_API_KEY: ${{ secrets.YT_DATA_API_KEY }}
      SHORTS_TREND_MODE: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check key and fetch public metadata ONLY (never upload)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'requests==2.34.2'
          python -m py_compile shorts_bot/trend_ideas.py
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'shorts_bot')
          from trend_ideas import TrendAccessError, _recent_candidates
          if not os.environ.get('YT_DATA_API_KEY', '').strip():
              raise SystemExit('FAIL: YT_DATA_API_KEY secret is missing or empty. No video uploaded.')
          try:
              candidates = _recent_candidates('science')
          except TrendAccessError as exc:
              raise SystemExit(f'FAIL: {exc} No video uploaded.')
          except Exception as exc:
              # NEVER print exception details: requests exceptions may contain ?key=...
              raise SystemExit(f'FAIL: public metadata request failed ({type(exc).__name__}). No video uploaded.')
          print('PASS: authenticated YouTube Data API v3 search and video metadata requests succeeded.')
          print('Eligible recent science short-form candidates:', len(candidates))
          if candidates:
              print('Example public video ID:', candidates[0]['id'])
              print('Example observed views:', candidates[0]['views'])
          print('No video generated or uploaded. No secret printed.')
          PY
