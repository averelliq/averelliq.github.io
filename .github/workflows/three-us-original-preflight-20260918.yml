name: Three US Shorts — No-Upload Preflight 2026-09-18

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/three-us-original-preflight-20260918.yml

permissions:
  contents: read

jobs:
  preflight-three:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      SHORTS_SKIP_UPLOAD: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies only (never upload)
        run: |
          pip install -r shorts_bot/requirements.txt
          python -m py_compile shorts_bot/three_us_original_shorts_20260918_evening.py shorts_bot/two_original_shorts_20260918.py
      - name: Verify three scripts and real portrait stock availability without YouTube access
        run: |
          PYTHONPATH=shorts_bot python - <<'PY'
          import three_us_original_shorts_20260918_evening as us
          us.verify_all()
          for name,plan in us.PLANS.items():
              us.pair.preflight(plan)
              print('PASS NO-UPLOAD US FOOTAGE PREFLIGHT',name,flush=True)
          print('PASS ALL THREE - NO YOUTUBE CREDENTIALS / NO UPLOAD',flush=True)
          PY
