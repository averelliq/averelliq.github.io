name: KAYIP FREKANS - V5 Ses Onarim ve Video
on:
  push:
    paths:
      - .github/workflows/kayip-frekans-v5-audio-repair.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  repair-and-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ses ve video araclarini kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install Pillow==11.3.0 numpy==1.26.4
      - name: Bitmis videonun kaynak sesini ve altyazilarini getir
        uses: actions/download-artifact@v4
        with:
          name: KAYIP-FREKANS-17DK-VIDEO-VE-ANALIZ
          repository: averelliq/averelliq.github.io
          run-id: 35215821903
          github-token: ${{ github.token }}
          path: output
      - name: Uzun bosluklari kisalt ve altyaziyi birebir zamanla
        run: |
          python -u kayip_frekans/audio_quality_v5.py --output-dir output --max-pause 0.90
          mv output/narration-v5.wav output/narration.wav
      - name: Cizirti icin hafif tik temizleme
        run: |
          mv output/narration.wav output/pre-declick.wav
          ffmpeg -v error -y -i output/pre-declick.wav -af 'adeclick=window=55:overlap=75:threshold=3,highpass=f=55' -ac 1 -ar 24000 -c:a pcm_s16le output/narration.wav
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          data=json.loads(Path('output/audio_quality_v5_report.json').read_text(encoding='utf-8'))
          seconds=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1','output/narration.wav'],text=True))
          assert abs(seconds-data['output_seconds'])<.1, 'Tik filtresi zamani kaydirdi'
          assert 900<=seconds<=1200, '15-20 dakika araligi disinda'
          print('Ses onarimi tamam:',round(seconds,2),'saniye',flush=True)
          PY
      - name: Goruntuleri baglama gore yeniden dagit
        run: python -u kayip_frekans/visual_balance_v5.py output
      - name: Tek ses ve 1080p gorsel montaj
        timeout-minutes: 105
        run: |
          python -u -c "import sys; sys.path.insert(0,'kayip_frekans'); import cloud_v3 as v3; v3.FPS=15; import cloud_v4; v3.main()" --stage render
      - name: MP4 ve altyazi son kontrolu
        if: success()
        run: |
          python - <<'PY'
          import json, subprocess, re
          from pathlib import Path
          d=Path('output')
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(d/'final.mp4')]))
          v=next(s for s in info['streams'] if s['codec_type']=='video')
          assert (v['width'],v['height'])==(1920,1080)
          assert any(s['codec_type']=='audio' for s in info['streams'])
          duration=float(info['format']['duration'])
          assert 900<=duration<=1200
          captions=(d/'captions.srt').read_text(encoding='utf-8')
          assert 'ı' in captions and 'ş' in captions
          assert len(re.findall(' --> ',captions))>=200
          stats=json.loads((d/'audio_quality_v5_report.json').read_text(encoding='utf-8'))
          report=json.loads((d/'quality_report.json').read_text(encoding='utf-8'))
          report.update({'audio_pause_repair_v5':stats,'human_listening_required':True,'converted_voice_naturalness_verified':False,'youtube_uploaded':False,
                         'visual_style':'Locally generated abstract scene illustrations when Pexels unavailable',
                         'visuals_are_real_photographs':False})
          (d/'quality_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          (d/'validation.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          metadata=json.loads((d/'metadata.json').read_text(encoding='utf-8'))
          metadata['description']=metadata.get('description','').replace('Atmosfer görüntüleri temsili stok fotoğraflardır.','Görseller temsili, yerel olarak oluşturulan soyut sahne çizimleridir.')
          metadata['duration_seconds']=duration
          (d/'metadata.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL V5',round(duration,2),'s 1080p, altyazi',len(re.findall(' --> ',captions)),flush=True)
          PY
      - name: Video ve ses analiz paketini kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAYIP-FREKANS-V5-SES-ONARIMI-15DK
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
          path: |
            output/final.mp4
            output/narration.wav
            output/captions.srt
            output/story.txt
            output/thumbnail.jpg
            output/audio_quality_v5_report.json
            output/voice_pipeline.json
            output/quality_report.json
            output/validation.json
            output/scene_plan.json
            output/metadata.json
            output/shots.json
