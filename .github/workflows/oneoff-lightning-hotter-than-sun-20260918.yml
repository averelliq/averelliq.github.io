name: One-off Lightning Hotter Than Sun's Surface Short 2026-09-18

on:
  push:
    paths:
      - .github/workflows/oneoff-lightning-hotter-than-sun-20260918.yml

permissions:
  contents: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  create-and-publish-one:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: public
      SHORTS_SKIP_UPLOAD: '0'
      GEMINI_MODEL: gemini-3.5-flash-lite
      TTS_VOICE: am_michael
      SHORTS_MAX_VISUAL_CANDIDATES: '9'
      SHORTS_MUSIC: '1'
      SHORTS_MUSIC_GAIN: '0.16'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - name: Cache free narrator
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install narrator and filmed-video editing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          pip install -r shorts_bot/requirements.txt
          pip check
          python -m py_compile shorts_bot/one_lightning_live_20260918.py shorts_bot/safe_captions.py shorts_bot/montage_fx.py shorts_bot/live_action_guard.py shorts_bot/visual_guard.py shorts_bot/selection_guard.py shorts_bot/quality_entry.py shorts_bot/upgrade.py
      - name: Validate scientific narration and phone-safe single caption layer without upload
        run: |
          PYTHONPATH=shorts_bot python - <<'PY'
          import one_lightning_live_20260918 as s
          import safe_captions as c
          s.validate()
          for scene in s.PLAN['scenes']:
              words=scene['voiceover'].split()
              groups=c.cues(words)
              assert [word for group in groups for word in group] == words
              assert all(len(' '.join(group))<=19 and len(group)<=3 for group in groups)
          print('PASS: original lightning script, five filmed-shot queries, phone-safe subtitles; NO UPLOAD IN TEST',flush=True)
          PY
      - name: Generate one, inspect cropped live-action scene footage, publish ONE video
        run: |
          test "$YOUTUBE_PRIVACY" = public
          test "$SHORTS_SKIP_UPLOAD" = 0
          python shorts_bot/one_lightning_live_20260918.py
      - name: Preserve original MP4 and proof of scene sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightning-curiosity-short-${{ github.run_id }}
          path: |
            shorts_bot/one_lightning_output_20260918/short.mp4
            shorts_bot/one_lightning_output_20260918/plan.json
            shorts_bot/one_lightning_output_20260918/visual_sources.json
            shorts_bot/one_lightning_work_20260918/captions.ass
          if-no-files-found: ignore
          retention-days: 5
