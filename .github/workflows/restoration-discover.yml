name: Restoration Shorts - Candidate discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restoration-discover.yml'
      - 'restoration-shorts-bot/**'
  workflow_dispatch:
  schedule:
    - cron: '20 8 * * *'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: restoration-shorts-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test restoration selection and review queue
        run: python -m unittest discover -s tests -v
      - name: Find possible restoration footage for human review
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo 'Existing PEXELS_API_KEY is unavailable in this GitHub repository.' >&2
            exit 1
          fi
          python candidate_finder.py discover
      - name: Save watchable links and review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restoration-review-leads
          path: |
            restoration-shorts-bot/output/candidates.json
            restoration-shorts-bot/output/review_report.json
            restoration-shorts-bot/output/review_gallery.html
          if-no-files-found: warn
          retention-days: 7
