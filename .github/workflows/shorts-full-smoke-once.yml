name: One-Off Full Shorts Production Smoke

on:
  push:
    branches: [main]
    paths: [.github/workflows/shorts-full-smoke-once.yml]

permissions:
  contents: read

jobs:
  full-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_DATA_API_KEY: ${{ secrets.YT_DATA_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      TTS_VOICE: am_michael
      SHORTS_THEME: science
      SHORTS_AI_REVIEW: '1'
      SHORTS_TREND_MODE: auto
      SHORTS_SKIP_UPLOAD: '1'
      YOUTUBE_PRIVACY: private
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install render tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
      - name: Install Python packages and compile
        run: |
          python -m pip install --upgrade pip
          pip install -r shorts_bot/requirements.txt
          pip check
          python -m compileall -q shorts_bot
          ffmpeg -version | head -n 1
      - name: End-to-end trend, script, voice, visuals, render and final review (NO UPLOAD)
        run: |
          test "$SHORTS_SKIP_UPLOAD" = 1
          test -z "${YT_CLIENT_ID:-}${YT_CLIENT_SECRET:-}${YT_REFRESH_TOKEN:-}"
          python shorts_bot/quality_entry.py
      - name: Verify final MP4 and scene plan
        run: |
          test -s shorts_bot/output/short.mp4
          test -s shorts_bot/output/plan.json
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 shorts_bot/output/short.mp4
      - name: Save MP4 and diagnostics (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-smoke-short-${{ github.run_id }}
          path: |
            shorts_bot/output/short.mp4
            shorts_bot/output/plan.json
            shorts_bot/output/visual_sources.json
            shorts_bot/work/captions.srt
          if-no-files-found: ignore
          retention-days: 5
