name: Publish Reviewed Three CurioRush Shorts

on:
  push:
    paths:
      - 'shorts_bot/three_offline_release.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  publish-reviewed:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      GH_TOKEN: ${{ github.token }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - name: Checkout exact approved MP4 hashes
        uses: actions/checkout@v4
      - name: Retrieve all three exact preview artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: curiorush-three-*-35490083726
          run-id: 35490083726
          github-token: ${{ github.token }}
          path: shorts_bot/three_offline_reviewed
          merge-multiple: false
      - name: Install upload validator
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install 'requests>=2.31,<3' 'google-api-python-client>=2.100,<3' 'google-auth>=2.20,<3'
          python -m pip check
          python -m py_compile shorts_bot/publish_three_offline.py
      - name: Verify each approved MP4 and publish original once
        run: python -u shorts_bot/publish_three_offline.py
      - name: Save YouTube publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curiorush-three-youtube-receipts-${{ github.run_id }}
          path: shorts_bot/three_offline_reviewed/publication_receipts.json
          if-no-files-found: ignore
          retention-days: 30
