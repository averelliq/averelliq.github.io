name: CurioRush Three Process Formats — Create and Publish

on:
  push:
    paths:
      - 'shorts_bot/three_formats_request.json'

permissions:
  contents: write

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  process-formats:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - theme: history
            category: how-its-made
          - theme: science
            category: how-it-works
          - theme: everyday
            category: raw-to-finished
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_DATA_API_KEY: ${{ secrets.YT_DATA_API_KEY }}
      YOUTUBE_PRIVACY: public
      GEMINI_MODEL: gemini-3.6-flash
      GEMINI_FALLBACK_MODELS: gemini-3.5-flash,gemini-3.5-flash-lite
      TTS_VOICE: am_michael
      SHORTS_THEME: ${{ matrix.theme }}
      SHORTS_AI_REVIEW: '1'
      SHORTS_TREND_MODE: auto
      SHORTS_US_TRENDS: '0'
      SHORTS_MUSIC: '1'
      SHORTS_MUSIC_GAIN: '0.20'
      SHORTS_SKIP_UPLOAD: '0'
    steps:
      - name: Checkout bot and three-format request
        uses: actions/checkout@v4
      - name: Verify request is explicitly for these three original Shorts
        env:
          REQUESTED_CATEGORY: ${{ matrix.category }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          request = json.loads(Path('shorts_bot/three_formats_request.json').read_text(encoding='utf-8'))
          if request.get('publish_public') is not True or request.get('categories') != ['how-its-made','how-it-works','raw-to-finished']:
              raise ValueError('Three-format request does not authorize these uploads')
          if os.environ['REQUESTED_CATEGORY'] not in request['categories']:
              raise ValueError('Unexpected category; refuse upload')
          print('Explicit three-format public upload request verified')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install video and voice dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
          python -m pip install -r shorts_bot/requirements.txt
          python -m pip check
          python -m compileall -q shorts_bot
      - name: Build format-specific Short, validate filmed scenes and voice, publish only after all gates
        run: PYTHONPATH=shorts_bot python -u shorts_bot/montage_entry.py
      - name: Save exact MP4 and plan for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curiorush-${{ matrix.category }}-${{ github.run_id }}
          path: |
            shorts_bot/output/short.mp4
            shorts_bot/output/plan.json
            shorts_bot/output/visual_sources.json
          if-no-files-found: ignore
          retention-days: 7
