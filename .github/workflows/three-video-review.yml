name: Three How-It-Works Shorts - Review Before Publishing
on:
  push:
    branches: [main]
    paths:
      - shorts_bot/three_video_request.json
permissions:
  contents: read
concurrency:
  group: curiorush-three-short-previews
  cancel-in-progress: false
jobs:
  produce-previews:
    if: github.repository == 'averelliq/averelliq.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        subject: [espresso, grapes, pottery]
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TTS_VOICE: am_michael
      SHORTS_SKIP_UPLOAD: '1'
      SHORTS_CTA: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install genuine footage and narration renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          python -m pip install -r shorts_bot/requirements.txt pillow
          python -m pip check
      - name: Check code and enforce no upload credentials
        run: |
          python -m py_compile shorts_bot/three_video_review.py shorts_bot/espresso_manual_review_entry.py shorts_bot/grape_accurate_preview.py shorts_bot/pottery_preview_entry.py
          test "$SHORTS_SKIP_UPLOAD" = '1'
          test -n "$PEXELS_API_KEY"
          test -z "${YT_REFRESH_TOKEN:-}"
      - name: Produce and decode-check actual full MP4 with real footage and English like-subscribe CTA
        run: PYTHONPATH=shorts_bot python -u shorts_bot/three_video_review.py '${{ matrix.subject }}'
      - name: Preserve exact video, provenance, scene evidence and CTA frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-short-review-${{ matrix.subject }}-${{ github.run_id }}
          path: |
            shorts_bot/output/short.mp4
            shorts_bot/output/plan.json
            shorts_bot/output/visual_sources.json
            shorts_bot/output/scene_*.jpg
            shorts_bot/output/*_cta_proof.jpg
            shorts_bot/output/manual_review_required.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
