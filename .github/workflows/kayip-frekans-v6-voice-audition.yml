name: KAYIP FREKANS - V6 Serkan Ses Denemesi
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kf-v6-voice-audition
  cancel-in-progress: true
jobs:
  voice-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      # Three PRIVATE transport fragments of ONE complete 44-second Opus input.
      # Never commit or log the audio or any of these secret values.
      KF_REF_OPUS_B64_1: ${{ secrets.KF_REF_OPUS_B64_1 }}
      KF_REF_OPUS_B64_2: ${{ secrets.KF_REF_OPUS_B64_2 }}
      KF_REF_OPUS_B64_3: ${{ secrets.KF_REF_OPUS_B64_3 }}
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tam gizli referans on kosulu
        run: |
          if [[ -z "$KF_REF_OPUS_B64_1" || -z "$KF_REF_OPUS_B64_2" || -z "$KF_REF_OPUS_B64_3" ]]; then
            echo '::error::44 saniyelik referans icin KF_REF_OPUS_B64_1/2/3 secrets eksik. Ucretli model kurulumuna veya kisa public sese dusulmedi.'
            exit 1
          fi
      - name: FFmpeg ve ucretsiz CPU modelini kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          pip install chatterbox-tts==0.1.7 soundfile
      - name: Dogrudan tam referansla uc Turkce ses denemesi
        timeout-minutes: 75
        run: |
          python -u kayip_frekans/voice_preview_v6.py --output output/voice-audition
      - name: Yalnizca dinleme ve karsilastirma icin ses paketini yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAYIP-FREKANS-V6-REFERANS-SES-TESTI
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
          # The PRIVATE source and 10s reference windows are never artifacts.
          path: |
            output/voice-audition/serkan-v6-*.wav
            output/voice-audition/voice_audition_v6.json
