name: One-off Octopus 3 Hearts Blue Blood Short 2026-09-18

on:
  push:
    paths:
      - .github/workflows/oneoff-octopus-three-hearts-20260918.yml

permissions:
  contents: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  render-review-and-publish-one:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: public
      SHORTS_SKIP_UPLOAD: '0'
      GEMINI_MODEL: gemini-3.5-flash-lite
      TTS_VOICE: am_michael
      SHORTS_MAX_VISUAL_CANDIDATES: '9'
      SHORTS_MUSIC: '1'
      SHORTS_MUSIC_GAIN: '0.16'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - name: Cache narrator
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install free narrator and video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          pip install -r shorts_bot/requirements.txt
          pip check
          python -m py_compile shorts_bot/one_octopus_live_20260918.py shorts_bot/one_octopus_fixed_launch_20260918.py shorts_bot/safe_captions.py shorts_bot/montage_fx.py shorts_bot/live_action_guard.py shorts_bot/visual_guard.py shorts_bot/selection_guard.py shorts_bot/quality_entry.py shorts_bot/upgrade.py
      - name: Check corrected hook, short captions and distinct visual beats
        run: |
          PYTHONPATH=shorts_bot python - <<'PY'
          import safe_captions as c
          import one_octopus_fixed_launch_20260918 as launch
          import one_octopus_live_20260918 as o
          launch.apply_fix()
          o.validate()
          for scene in o.PLAN['scenes']:
              words=scene['voiceover'].split()
              groups=c.cues(words)
              assert [word for group in groups for word in group]==words
              assert all(len(' '.join(group))<=c.MAX_CHARS for group in groups)
              assert all(len(group)<=c.MAX_WORDS for group in groups)
          print('PASS: corrected hook, five distinct beats, phone-safe caption cues; NO UPLOAD IN TEST',flush=True)
          PY
      - name: Generate one, independently inspect live-action frames, upload to YouTube
        run: |
          test "$YOUTUBE_PRIVACY" = public
          test "$SHORTS_SKIP_UPLOAD" = 0
          python shorts_bot/one_octopus_fixed_launch_20260918.py
      - name: Preserve original MP4, scene evidence, caption source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: octopus-curiosity-short-${{ github.run_id }}
          path: |
            shorts_bot/one_octopus_output_20260918/short.mp4
            shorts_bot/one_octopus_output_20260918/plan.json
            shorts_bot/one_octopus_output_20260918/visual_sources.json
            shorts_bot/one_octopus_work_20260918/captions.ass
          if-no-files-found: ignore
          retention-days: 5
