name: Restoration Shorts - Render reviewed example-style footage

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Reviewed JSON in restoration-shorts-bot/approved/, e.g. approved/my-restoration.json'
        required: true
        type: string
      upload_private:
        description: 'Upload PRIVATE only, using confirmed same-repository YouTube credentials'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: restoration-shorts-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Run example-style validation tests
        run: python -m unittest discover -s tests -v
      - name: Render chronological before-work-after Shorts and optionally upload privately
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MANIFEST: ${{ inputs.manifest }}
          UPLOAD_PRIVATE: ${{ inputs.upload_private }}
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo 'PEXELS_API_KEY is unavailable in this GitHub repository.' >&2
            exit 1
          fi
          if [ "$UPLOAD_PRIVATE" = 'true' ]; then
            if [ -z "$YT_CLIENT_ID" ] || [ -z "$YT_CLIENT_SECRET" ] || [ -z "$YT_REFRESH_TOKEN" ]; then
              echo 'YouTube OAuth secret names not present here. Do not copy secrets into source code.' >&2
              exit 1
            fi
            python style_bot.py render --manifest "$MANIFEST" --upload-private
          else
            python style_bot.py render --manifest "$MANIFEST"
          fi
      - name: Save MP4, factual narration and source credit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restoration-example-style-preview
          path: |
            restoration-shorts-bot/output/short.mp4
            restoration-shorts-bot/output/script.txt
            restoration-shorts-bot/output/source-info.json
          if-no-files-found: warn
          retention-days: 7
