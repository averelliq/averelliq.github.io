name: Publish Reviewed CurioRush Shorts

on:
  push:
    paths:
      - 'shorts_bot/six_shorts_release.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  publish-reviewed:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      GH_TOKEN: ${{ github.token }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - name: Checkout approved release manifest
        uses: actions/checkout@v4
      - name: Download exact preview MP4s and visual evidence
        uses: actions/download-artifact@v4
        with:
          pattern: curiorush-six-*-35482216058
          run-id: 35482216058
          github-token: ${{ github.token }}
          path: shorts_bot/six_reviewed
          merge-multiple: false
      - name: Install verified uploader
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install 'requests>=2.31,<3' 'google-api-python-client>=2.100,<3' 'google-auth>=2.20,<3'
          python -m pip check
          python -m py_compile shorts_bot/publish_six_reviewed.py
      - name: Verify each approved MP4 fingerprint and upload it once
        run: python -u shorts_bot/publish_six_reviewed.py
      - name: Preserve confirmed YouTube URLs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-shorts-youtube-receipts-${{ github.run_id }}
          path: shorts_bot/six_reviewed/publication_receipts.json
          if-no-files-found: ignore
          retention-days: 30
