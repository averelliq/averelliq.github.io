name: KAYIP FREKANS - Onayli Tok Ses Kisa Video Testi
on:
  push:
    paths:
      - kayip_frekans/approved_voice.json
      - kayip_frekans/tok_short_smoke.py
      - .github/workflows/kayip-frekans-tok-short-test.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: kf-approved-tok-short-test
  cancel-in-progress: true
jobs:
  short-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install temporary test media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install Pillow==11.3.0
      - name: Retrieve only the prior private narrator AUDITION artifact
        uses: actions/download-artifact@v4
        with:
          run-id: '35222626464'
          name: KAYIP-FREKANS-V6-REFERANS-SES-TESTI
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: input/audio
      - name: Verify voice approval and prevent default narrator fallback
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          cfg=json.loads(Path('kayip_frekans/approved_voice.json').read_text(encoding='utf-8'))
          audio=Path('input/audio/serkan-v6-2-tok.wav')
          assert cfg['approved_by_user'] is True
          assert cfg['approved_variant']=='tok'
          assert cfg['fallback_tts_allowed'] is False
          assert cfg['legacy_ahmet_openvoice_allowed'] is False
          assert cfg['youtube_autopublish_allowed'] is False
          assert hashlib.sha256(audio.read_bytes()).hexdigest()==cfg['source_audio_sha256']
          print('Approved tok sample verified; other TTS voices disabled')
          PY
      - name: Make short review video using exactly the approved tok WAV
        run: |
          python -u kayip_frekans/tok_short_smoke.py --audio input/audio/serkan-v6-2-tok.wav --output output/tok-short-test
      - name: Store test clip only; DO NOT publish to YouTube
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAYIP-FREKANS-TOK-KISA-VIDEO-TESTI
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0
          path: |
            output/tok-short-test/KAYIP_FREKANS_TOK_KISA_VIDEO_TEST.mp4
            output/tok-short-test/report.json
