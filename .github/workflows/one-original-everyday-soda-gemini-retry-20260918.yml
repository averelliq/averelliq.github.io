name: Original Soda Short — Retry Temporary Gemini 503 — 2026-09-18

on:
  push:
    paths:
      - .github/workflows/one-original-everyday-soda-gemini-retry-20260918.yml

permissions:
  contents: read

concurrency:
  group: unique-soda-gemini-retry-20260918
  cancel-in-progress: false

jobs:
  publish-one-soda:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: public
      SHORTS_SKIP_UPLOAD: '0'
      GEMINI_MODEL: gemini-3.5-flash-lite
      TTS_VOICE: am_michael
      SHORTS_MAX_VISUAL_CANDIDATES: '9'
      SHORTS_MUSIC: '1'
      SHORTS_MUSIC_GAIN: '0.16'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout fresh source
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - name: Cache narrator
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install free narration and video-editing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          pip install -r shorts_bot/requirements.txt
          pip check
          python -m py_compile shorts_bot/one_everyday_soda_review_retry_20260918.py shorts_bot/gemini_transient_guard.py shorts_bot/one_everyday_soda_finalshot_20260918.py shorts_bot/two_original_shorts_20260918.py shorts_bot/montage_fx.py shorts_bot/live_action_guard.py shorts_bot/quality_entry.py shorts_bot/safe_captions.py
      - name: Original script and mobile caption precheck (no upload)
        run: |
          PYTHONPATH=shorts_bot python - <<'PY'
          import two_original_shorts_20260918 as pair
          plan=pair.PLANS['everyday']
          plan['scenes'][0]['voiceover']='Soda bubbles are escaping gas. Why do they race upward?'
          plan['scenes'][4].update(query='soda bubbles macro',backup_queries=['sparkling soda fizz','carbonated drink bubbles closeup'],caption='Bubbles reach the surface')
          pair.verify_script(plan)
          print('PASS original script and no-overflow captions; NO UPLOAD',flush=True)
          PY
      - name: Render filmed video, retry transient QC only, publish ONE soda Short
        run: python shorts_bot/one_everyday_soda_review_retry_20260918.py
      - name: Save video and full QC proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-soda-reviewed-${{ github.run_id }}
          path: |
            shorts_bot/two_original_everyday_output_20260918/short.mp4
            shorts_bot/two_original_everyday_output_20260918/plan.json
            shorts_bot/two_original_everyday_output_20260918/visual_sources.json
            shorts_bot/two_original_everyday_work_20260918/captions.ass
          if-no-files-found: ignore
          retention-days: 5
