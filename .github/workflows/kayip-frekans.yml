name: KAYIP FREKANS - Ucretsiz Video Botu
on:
  workflow_dispatch:
    inputs:
      topic:
        description: Hikaye konusu
        default: Köy evinin kapısından ölmüş kardeşimin sesini duydum
        type: string
      minutes:
        description: Hedef dakika (5-35; gerçek süre seslendirmeye bağlı)
        default: '30'
        type: string
      test:
        description: Sadece kısa üretim testi
        default: false
        type: boolean
  push:
    paths:
      - kayip_frekans/**
      - .github/workflows/kayip-frekans.yml
  pull_request:
    paths:
      - kayip_frekans/**
      - .github/workflows/kayip-frekans.yml
permissions:
  contents: read
concurrency:
  group: kayip-frekans-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test bagimliliklari
        run: pip install Pillow==11.3.0
      - name: Turkce giris ve kalite testleri
        run: python -m unittest discover -s kayip_frekans -p 'test_*.py' -v
      - name: Python sozdizimi
        run: python -m py_compile kayip_frekans/bot.py kayip_frekans/cloud_v2.py kayip_frekans/cloud_v3.py kayip_frekans/cloud_v4.py kayip_frekans/cloud_v5.py kayip_frekans/cloud_v6.py kayip_frekans/quality.py
  video:
    if: github.event.repository.private == false && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      STORY_TOPIC: ${{ inputs.topic }}
      TARGET_MINUTES: ${{ inputs.minutes || '30' }}
      SHORT_TEST: ${{ github.event_name != 'workflow_dispatch' || inputs.test }}
      FAST_VISUAL_SMOKE: ${{ github.event_name == 'push' && '1' || '0' }}
      OLLAMA_HOST: 127.0.0.1:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ucretsiz araclari GitHub sunucusuna kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r kayip_frekans/requirements.txt
          if [ "$FAST_VISUAL_SMOKE" != "1" ]; then
            curl --fail --location --retry 3 https://ollama.com/install.sh -o /tmp/install-ollama.sh
            sh /tmp/install-ollama.sh
            ollama serve >/tmp/ollama.log 2>&1 &
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
              sleep 2
            done
            ollama pull gemma3:4b
          else
            echo 'FAST_VISUAL_SMOKE=1: Ollama kurulumu ve model indirme atlandı.'
          fi
      - name: Hikaye yaz ve editor kontrolunden gecir
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.test != true && 120 || 15 }}
        run: |
          if [ "$SHORT_TEST" = "true" ]; then
            python -u kayip_frekans/cloud_v6.py --stage story --smoke
          else
            python -u kayip_frekans/cloud_v6.py --stage story
          fi
      - name: Turkce ses ve kelime zamanli altyazi
        timeout-minutes: 30
        run: python -u kayip_frekans/cloud_v6.py --stage narration
      - name: Sahne sec ve 1080p sinematik video olustur
        timeout-minutes: 45
        run: python -u kayip_frekans/cloud_v6.py --stage render
      - name: Hazir videoyu indirilebilir yap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAYIP-FREKANS-${{ github.run_number }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
          path: |
            output/final.mp4
            output/thumbnail.jpg
            output/story.txt
            output/story_only.txt
            output/intro.txt
            output/captions.srt
            output/metadata.json
            output/validation.json
            output/quality_report.json
            output/scene_plan.json
            output/shots.json
            output/visual_sources.json
            output/credits.txt
            output/plan.json
            output/state.json
            output/draft-*.txt
