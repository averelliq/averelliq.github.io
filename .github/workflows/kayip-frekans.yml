name: KAYIP FREKANS - Kalite ve Kontrollu Video
on:
  workflow_dispatch:
    inputs:
      topic:
        description: Hikaye konusu
        default: Köy evinin kapısından ölmüş kardeşimin sesini duydum
        type: string
      minutes:
        description: Hedef dakika (5-35)
        default: '20'
        type: string
      test:
        description: Kisa teknik test
        default: true
        type: boolean
      legacy_voice_approved:
        description: Yalnizca ESKI Ahmet+OpenVoice sesini bilerek kabul ettiyseniz isaretleyin; V6 Serkan klonu DEGIL
        default: false
        type: boolean
  push:
    paths:
      - kayip_frekans/**
      - .github/workflows/kayip-frekans.yml
  pull_request:
    paths:
      - kayip_frekans/**
      - .github/workflows/kayip-frekans.yml
permissions:
  contents: read
concurrency:
  group: kayip-frekans-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test bagimliliklari
        run: pip install Pillow==11.3.0 numpy==1.26.4
      - name: Turkce metin, ses ve gorsel testleri
        run: python -m unittest discover -s kayip_frekans -p 'test_*.py' -v
      - name: Python sozdizimi
        run: python -m py_compile kayip_frekans/bot.py kayip_frekans/cloud_v2.py kayip_frekans/cloud_v3.py kayip_frekans/cloud_v4.py kayip_frekans/cloud_v5.py kayip_frekans/audio_quality_v5.py kayip_frekans/visual_balance_v5.py kayip_frekans/voice_preview_v6.py kayip_frekans/quality.py
  video:
    # STOP: the existing V5 pipeline uses Ahmet + OpenVoice, not the approved
    # voice. Pushes/PRs only test code; no automatic video or public upload.
    if: github.event_name == 'workflow_dispatch' && inputs.legacy_voice_approved == true && github.event.repository.private == false
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      STORY_TOPIC: ${{ inputs.topic }}
      TARGET_MINUTES: ${{ inputs.minutes || '20' }}
      SHORT_TEST: ${{ inputs.test }}
      OLLAMA_HOST: 127.0.0.1:11434
      KF_ALLOW_ABSTRACT_VISUALS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ucretsiz araclari GitHub sunucusuna kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r kayip_frekans/requirements.txt
          pip install --no-deps openvoice-cli==0.0.5
          if [ "$SHORT_TEST" != "true" ]; then
            curl --fail --location --retry 3 https://ollama.com/install.sh -o /tmp/install-ollama.sh
            sh /tmp/install-ollama.sh
            ollama serve >/tmp/ollama.log 2>&1 &
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
              sleep 2
            done
            ollama pull gemma3:4b
          fi
      - name: Hikaye yaz ve editor kontrolunden gecir
        timeout-minutes: 120
        run: |
          if [ "$SHORT_TEST" = "true" ]; then
            python -u kayip_frekans/cloud_v5.py --stage story --smoke
          else
            python -u kayip_frekans/cloud_v5.py --stage story
          fi
      - name: Eski ses ve altyazi - YALNIZCA MANUEL ONAYLA
        timeout-minutes: 90
        run: python -u kayip_frekans/cloud_v5.py --stage narration
      - name: Gercek fotograflarla video - Pexels hatasinda DUR
        timeout-minutes: 45
        run: python -u kayip_frekans/cloud_v5.py --stage render
      - name: Videoyu inceleme icin kaydet; YouTube'a yukleme YOK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAYIP-FREKANS-LEGACY-${{ github.run_number }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
          path: |
            output/final.mp4
            output/thumbnail.jpg
            output/story.txt
            output/captions.srt
            output/metadata.json
            output/validation.json
            output/quality_report.json
            output/audio_quality_v5_report.json
            output/voice_pipeline.json
            output/narration.wav
            output/scene_plan.json
            output/shots.json
            output/visual_sources.json
            output/credits.txt
            output/state.json
