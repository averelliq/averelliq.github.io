name: Three NEW How-It-Works Shorts - No Upload Before Review
on:
  push:
    branches: [main]
    paths:
      - shorts_bot/three_fresh_request.json
permissions:
  contents: read
concurrency:
  group: curiorush-three-fresh-preview
  cancel-in-progress: false
jobs:
  produce-new-previews:
    if: github.repository == 'averelliq/averelliq.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 48
    strategy:
      fail-fast: false
      matrix:
        subject: [craft, mechanics, workshop]
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_FALLBACK_MODELS: gemini-3.5-flash,gemini-3.6-flash
      TTS_VOICE: am_michael
      SHORTS_SKIP_UPLOAD: '1'
      SHORTS_CTA: '1'
      SHORTS_THEME: everyday
      SHORTS_US_TRENDS: '0'
      SHORTS_AI_REVIEW: '1'
      SHORTS_MAX_VISUAL_CANDIDATES: '9'
      SHORTS_MUSIC: '1'
      SHORTS_MUSIC_GAIN: '0.20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install genuine real-footage and narration renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          python -m pip install -r shorts_bot/requirements.txt pillow
          python -m pip check
      - name: Confirm separate new topics and no YouTube OAuth credentials
        run: |
          python -m py_compile shorts_bot/three_fresh_entry.py shorts_bot/montage_entry.py shorts_bot/footage_first.py shorts_bot/cta_overlay.py
          test "$SHORTS_SKIP_UPLOAD" = '1'
          test -n "$PEXELS_API_KEY"
          test -n "$GEMINI_API_KEY"
          test -z "${YT_REFRESH_TOKEN:-}"
      - name: Produce and decode-check a genuinely new full MP4 with eight filmed scenes and Like Subscribe
        run: PYTHONPATH=shorts_bot python -u shorts_bot/three_fresh_entry.py '${{ matrix.subject }}'
      - name: Save exact MP4, source evidence, scene frames and CTA proof for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-fresh-short-${{ matrix.subject }}-${{ github.run_id }}
          path: |
            shorts_bot/output/short.mp4
            shorts_bot/output/plan.json
            shorts_bot/output/visual_sources.json
            shorts_bot/output/scene_*.jpg
            shorts_bot/output/*_cta_proof.jpg
            shorts_bot/output/manual_review_required.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
