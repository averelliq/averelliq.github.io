name: Two Original Curiosity Shorts — Viral Style and Everyday — 2026-09-18

on:
  push:
    paths:
      - .github/workflows/two-original-curiosity-shorts-20260918.yml

permissions:
  contents: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  produce-and-publish:
    name: Produce and verify ${{ matrix.category }} original Short
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        category: [viral, everyday]
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: public
      SHORTS_SKIP_UPLOAD: '0'
      GEMINI_MODEL: gemini-3.5-flash-lite
      TTS_VOICE: am_michael
      SHORTS_MAX_VISUAL_CANDIDATES: '9'
      SHORTS_MUSIC: '1'
      SHORTS_MUSIC_GAIN: '0.16'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout precise one-shot source
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - name: Cache narrator
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install free narration and editing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          pip install -r shorts_bot/requirements.txt
          pip check
          python -m py_compile shorts_bot/two_original_shorts_20260918.py shorts_bot/editorial_upgrade.py shorts_bot/safe_captions.py shorts_bot/quality_entry.py shorts_bot/montage_fx.py shorts_bot/live_action_guard.py shorts_bot/selection_guard.py shorts_bot/visual_guard.py shorts_bot/upgrade.py
      - name: Validate original script and safe captions without upload
        env:
          CATEGORY: ${{ matrix.category }}
        run: |
          PYTHONPATH=shorts_bot python - <<'PY'
          import os
          import two_original_shorts_20260918 as pair
          pair.verify_script(pair.PLANS[os.environ['CATEGORY']])
          assert pair.PLANS[os.environ['CATEGORY']]['series'] == 'Everyday Mysteries'
          print('ORIGINALITY/HOOK/CTA/CAPTIONS PRECHECK PASSED; NO UPLOAD',flush=True)
          PY
      - name: Render, independently inspect all five real video clips, upload one public Short
        env:
          CATEGORY: ${{ matrix.category }}
        run: |
          test "$YOUTUBE_PRIVACY" = public
          test "$SHORTS_SKIP_UPLOAD" = 0
          python shorts_bot/two_original_shorts_20260918.py "$CATEGORY"
      - name: Keep original MP4, source IDs, caption proof for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-${{ matrix.category }}-short-${{ github.run_id }}
          path: |
            shorts_bot/two_original_${{ matrix.category }}_output_20260918/short.mp4
            shorts_bot/two_original_${{ matrix.category }}_output_20260918/plan.json
            shorts_bot/two_original_${{ matrix.category }}_output_20260918/visual_sources.json
            shorts_bot/two_original_${{ matrix.category }}_work_20260918/captions.ass
          if-no-files-found: ignore
          retention-days: 5
