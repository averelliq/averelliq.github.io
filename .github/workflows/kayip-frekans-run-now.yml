name: KAYIP FREKANS - RUN NOW
on:
  push:
    paths:
      - .github/workflows/kayip-frekans-run-now.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Start corrected 15-minute test once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/kayip-frekans-mpt-long-serious.yml/dispatches'
          payload = {'ref': 'main', 'inputs': {
              'topic': 'Köyde gece yalnız kalan bir adam iki yıl önce ölen kardeşinin sesini önce dış kapıdan sonra evin içinden duyar; eski aile eşyası ve komşu tanıklığı sayesinde nedenini araştırır, finalde önceden gösterilen ipuçları birleşir. Cin görünmesi, kapı çarpması ve çığlık olayın doğal akışında serbesttir.',
              'target_minutes': '15',
          }}
          req = urllib.request.Request(url, data=json.dumps(payload).encode(), method='POST', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          })
          with urllib.request.urlopen(req, timeout=60) as response:
              if response.status != 204:
                  raise RuntimeError(f'Dispatch returned {response.status}')
          print('Corrected KAYIP FREKANS long workflow dispatched once')
          PY
