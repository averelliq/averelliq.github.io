name: KAYIP FREKANS - RUN NOW
on:
  push:
    paths:
      - .github/workflows/kayip-frekans-run-now.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Start corrected reference-style 15-minute test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/kayip-frekans-mpt-long-serious.yml/dispatches'
          payload = {
              'ref': 'main',
              'inputs': {
                  'topic': 'Koyde gece yalniz kalan bir adamin, iki yil once olen kardesinin sesini once dis kapidan sonra evin icinden duymasi; eski bir aile esyasi ve komsu tanikligi olayi giderek aciklar, finalde onceden ekilen ipuclari anlam kazanir',
                  'target_minutes': '15'
              }
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              if response.status != 204:
                  raise RuntimeError(f'Unexpected dispatch status {response.status}')
          print('Corrected KAYIP FREKANS long workflow dispatched.')
          PY
