name: CurioRush Publish Reviewed Corrected Grape

on:
  push:
    paths:
      - 'shorts_bot/grape_corrected_release.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  publish-grape:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      GH_TOKEN: ${{ github.token }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - name: Checkout exact independently reviewed SHA256 approval
        uses: actions/checkout@v4
      - name: Download exact corrected grape MP4 and review evidence
        uses: actions/download-artifact@v4
        with:
          name: curiorush-grape-corrected-35492137791
          run-id: 35492137791
          github-token: ${{ github.token }}
          path: shorts_bot/grape_corrected_reviewed/curiorush-grape-corrected-35492137791
      - name: Install MP4 verification and upload dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install 'requests>=2.31,<3' 'google-api-python-client>=2.100,<3' 'google-auth>=2.20,<3'
          python -m pip check
          python -m py_compile shorts_bot/publish_grape_corrected.py
      - name: Validate and upload approved grape MP4 only once
        run: python -u shorts_bot/publish_grape_corrected.py
      - name: Save genuine YouTube upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curiorush-grape-confirmation-${{ github.run_id }}
          path: shorts_bot/grape_corrected_reviewed/publication_receipts.json
          if-no-files-found: ignore
          retention-days: 30
