name: Publish Reviewed Espresso Short

on:
  push:
    paths:
      - 'shorts_bot/espresso_release_request.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  release-reviewed-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - name: Checkout release validation script
        uses: actions/checkout@v4
      - name: Download exact corrected preview artifact
        uses: actions/download-artifact@v4
        with:
          name: espresso-review-35479892366
          run-id: 35479892366
          github-token: ${{ github.token }}
          path: shorts_bot/reviewed_espresso_artifact
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal uploader dependencies and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install 'requests>=2.31,<3' 'google-api-python-client>=2.100,<3' 'google-auth>=2.20,<3'
          python -m pip check
      - name: Validate exact corrected MP4 and publish it publicly once
        run: python -u shorts_bot/publish_reviewed_espresso.py
      - name: Preserve upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-espresso-publication-${{ github.run_id }}
          path: shorts_bot/reviewed_espresso_artifact/publication_receipt.json
          if-no-files-found: ignore
          retention-days: 30
