name: One-Off Trend Discovery Probe

on:
  push:
    branches: [main]
    paths: [.github/workflows/trend-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      YT_DATA_API_KEY: ${{ secrets.YT_DATA_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upload-free API key check
        run: |
          pip install requests==2.34.2
          python -m py_compile shorts_bot/trend_ideas.py shorts_bot/quality_entry.py
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'shorts_bot')
          import trend_ideas as t
          assert t._duration('PT58S') == 58
          assert t._duration('PT1M2S') == 62
          assert t._duration('bad') == 0
          print('OFFLINE DURATION CHECKS PASS', flush=True)
          if not os.getenv('YT_DATA_API_KEY'):
              os.environ['YT_DATA_API_KEY'] = os.getenv('GEMINI_API_KEY', '')
          if not os.getenv('YT_DATA_API_KEY'):
              raise SystemExit('No candidate API key configured')
          try:
              found = t._recent_candidates('science')
          except Exception as exc:
              # Never print exception URLs: they may include API keys in query params.
              status = getattr(getattr(exc, 'response', None), 'status_code', None)
              print('EXISTING KEY CANNOT SEARCH YOUTUBE:', type(exc).__name__, status, flush=True)
              raise SystemExit(1)
          print('EXISTING KEY CAN SEARCH YOUTUBE; suitable short-form candidates:', len(found), flush=True)
          if found:
              print('TOP PUBLIC VIDEO ID:', found[0]['id'], flush=True)
          PY
