name: Publish Reviewed Genuine Grapes Short

on:
  push:
    paths:
      - 'shorts_bot/grape_accurate_release.json'
permissions:
  contents: write
  actions: read
concurrency:
  group: global-shorts-bot
  cancel-in-progress: false
jobs:
  publish-grape:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      GH_TOKEN: ${{ github.token }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Download only the exact visual-reviewed grape MP4
        uses: actions/download-artifact@v4
        with:
          name: curiorush-grape-accurate-35490968371
          run-id: 35490968371
          github-token: ${{ github.token }}
          path: shorts_bot/grape_accurate_reviewed/curiorush-grape-accurate-35490968371
      - name: Install YouTube uploader and FFmpeg decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install 'requests>=2.31,<3' 'google-api-python-client>=2.100,<3' 'google-auth>=2.20,<3'
          python -m pip check
          python -m py_compile shorts_bot/publish_grape_accurate.py
      - name: Verify original SHA256, seven distinct grape sources, then publish once
        run: python -u shorts_bot/publish_grape_accurate.py
      - name: Save YouTube publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curiorush-grape-publication-receipt-${{ github.run_id }}
          path: shorts_bot/grape_accurate_reviewed/publication_receipts.json
          if-no-files-found: ignore
          retention-days: 30
