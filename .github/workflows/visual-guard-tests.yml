name: Visual QA unit tests

on:
  push:
    branches: [main]
    paths:
      - shorts_bot/visual_guard.py
      - shorts_bot/test_visual_guard_v3.py
      - .github/workflows/visual-guard-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only small test dependency
        run: pip install requests
      - name: Check source compilation and offline tests; no video upload
        run: |
          python -m py_compile shorts_bot/visual_guard.py shorts_bot/test_visual_guard_v3.py
          python shorts_bot/test_visual_guard_v3.py -v
