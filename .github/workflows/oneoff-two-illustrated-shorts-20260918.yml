name: One-off Two Illustrated Global Shorts 2026-09-18

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneoff-two-illustrated-shorts-20260918.yml

permissions:
  contents: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  publish-two-original-illustrated-shorts:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: public
      SHORTS_SKIP_UPLOAD: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install free voice, media and image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          pip install -r shorts_bot/requirements.txt pillow
          pip check
          python -m py_compile shorts_bot/diagram_shorts.py shorts_bot/diagram_shorts_launch.py
      - name: Check original illustration logic and distinct scripts
        run: |
          PYTHONPATH=shorts_bot python - <<'PY'
          import hashlib, io
          from PIL import Image, ImageDraw
          import diagram_shorts as d
          import diagram_shorts_launch
          plans=d.PLANS
          assert len(plans)==2 and plans[0]['title']!=plans[1]['title']
          for p in plans:
              assert len(p['lines'])==8 and 70 <= len(' '.join(p['lines']).split()) <= 110
          im=Image.new('RGBA',(720,1280),'#000000'); dr=ImageDraw.Draw(im)
          diagram_shorts_launch.moon_disc(dr,360,640,60,.5)
          assert im.getpixel((360,640))[0]>200
          print('PASS: two original topics, accurate colored Moon-phase image, eight scenes each',flush=True)
          PY
      - name: Render both videos, check uniqueness, publish exactly twice
        run: |
          test "$YOUTUBE_PRIVACY" = public
          test "$SHORTS_SKIP_UPLOAD" = 0
          python shorts_bot/diagram_shorts_launch.py
      - name: Preserve original MP4 files and illustrated storyboards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: illustrated-shorts-${{ github.run_id }}
          path: |
            shorts_bot/diagram_output/*.mp4
            shorts_bot/diagram_work/*/scene_*.png
          if-no-files-found: ignore
          retention-days: 5
