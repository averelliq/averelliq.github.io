name: Review First Short Before Publishing

on:
  push:
    paths:
      - 'shorts_bot/review_first_request.json'

permissions:
  contents: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  preview-first:
    name: Fix first video, render MP4 for review, DO NOT publish
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_DATA_API_KEY: ${{ secrets.YT_DATA_API_KEY }}
      YOUTUBE_PRIVACY: private
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_FALLBACK_MODELS: gemini-3.5-flash,gemini-3.6-flash
      TTS_VOICE: am_michael
      SHORTS_THEME: everyday
      SHORTS_AI_REVIEW: '1'
      SHORTS_TREND_MODE: 'off'
      SHORTS_US_TRENDS: '0'
      SHORTS_MAX_VISUAL_CANDIDATES: '9'
      SHORTS_MUSIC: '1'
      SHORTS_MUSIC_GAIN: '0.20'
      SHORTS_SKIP_UPLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install FFmpeg and voice dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r shorts_bot/requirements.txt
          pip check
      - name: Verify request and preview-only safety
        run: |
          python -m compileall -q shorts_bot
          python - <<'PY'
          import json, os
          from pathlib import Path
          request = json.loads(Path('shorts_bot/review_first_request.json').read_text(encoding='utf-8'))
          assert request['topic'] == 'how an espresso machine brews coffee'
          assert request['publish'] is False
          assert os.environ['SHORTS_SKIP_UPLOAD'] == '1'
          assert os.environ.get('GITHUB_TOKEN')
          print('PREVIEW ONLY: YouTube publishing disabled until MP4 is reviewed.', flush=True)
          PY
      - name: Generate and quality-check the first video without uploading
        run: |
          PYTHONPATH=shorts_bot python - <<'PY'
          import os
          import trend_ideas
          import montage_entry
          assert os.environ['SHORTS_SKIP_UPLOAD'] == '1'
          trend_ideas._CACHE['everyday'] = 'how an espresso machine brews coffee'
          montage_entry.main()
          PY
      - name: Save MP4 and review evidence even if generation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-short-review-${{ github.run_id }}
          path: |
            shorts_bot/output/short.mp4
            shorts_bot/output/plan.json
            shorts_bot/output/visual_sources.json
          if-no-files-found: warn
          retention-days: 7
