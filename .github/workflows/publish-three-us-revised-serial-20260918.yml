name: Publish Three US Shorts Revised Serial — 2026-09-18

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-three-us-revised-serial-20260918.yml

permissions:
  contents: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  serial-three:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: public
      SHORTS_SKIP_UPLOAD: '0'
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_FALLBACK_MODELS: gemini-3.5-flash,gemini-3.6-flash
      TTS_VOICE: am_michael
      SHORTS_MAX_VISUAL_CANDIDATES: '12'
      SHORTS_MUSIC: '1'
      SHORTS_MUSIC_GAIN: '0.16'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install actual filmed-video, voiceover and subtitling dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          pip install -r shorts_bot/requirements.txt
          pip check
          python -m py_compile shorts_bot/three_us_review_corrections_20260918.py shorts_bot/three_us_original_shorts_20260918_evening.py shorts_bot/two_original_shorts_20260918.py shorts_bot/gemini_transient_guard.py
      - name: Render, verify and publish three ORIGINAL US topics ONE BY ONE (never skip quality checks)
        run: |
          failures=0
          for category in phone basketball pizza; do
            echo "=== START US ORIGINAL ${category} ==="
            if python shorts_bot/three_us_review_corrections_20260918.py "$category"; then
              echo "=== PASSED AND YOUTUBE PUBLISHED ${category} ==="
            else
              echo "=== ${category} FAILED OR REJECTED: NO SUCCESS CLAIM; CHECK LOGS ==="
              failures=$((failures+1))
            fi
            echo "=== END ${category} ==="
          done
          echo "TOTAL FAILED OR NOT PUBLISHED=${failures}"
          if [ "$failures" -ne 0 ]; then exit 1; fi
          echo "THREE DISTINCT PUBLIC US ORIGINAL SHORTS PUBLISHED"
      - name: Keep rendered MP4s, approved plans and footage sources for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-us-revised-${{ github.run_id }}
          path: |
            shorts_bot/two_original_phone_output_20260918/short.mp4
            shorts_bot/two_original_phone_output_20260918/plan.json
            shorts_bot/two_original_phone_output_20260918/visual_sources.json
            shorts_bot/two_original_basketball_output_20260918/short.mp4
            shorts_bot/two_original_basketball_output_20260918/plan.json
            shorts_bot/two_original_basketball_output_20260918/visual_sources.json
            shorts_bot/two_original_pizza_output_20260918/short.mp4
            shorts_bot/two_original_pizza_output_20260918/plan.json
            shorts_bot/two_original_pizza_output_20260918/visual_sources.json
          if-no-files-found: ignore
          retention-days: 5
