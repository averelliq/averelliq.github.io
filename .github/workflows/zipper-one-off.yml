name: One-Off Original Zipper Short

on:
  push:
    branches: [main]
    paths:
      - shorts_bot/zipper_short.py

permissions:
  contents: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  create-and-publish:
    if: github.repository == 'averelliq/averelliq.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TTS_VOICE: am_michael
      ZIPPER_ONE_OFF_PUBLISH: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install video and voice dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          python -m pip install -r shorts_bot/requirements.txt pillow
          python -m pip check
      - name: Check original animation code
        run: |
          python -m py_compile shorts_bot/zipper_short.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'shorts_bot')
          import zipper_short as z
          assert sum(len(s[1].split()) for s in z.SCENES) >= 65
          assert z.frame(2, 32, [i * 4 for i in range(9)]).size == (540, 960)
          print('Original illustration and narration checks passed')
          PY
      - name: Render verify and publish public Short
        run: python shorts_bot/zipper_short.py
      - name: Save actual rendered MP4 and YouTube result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-zipper-short-${{ github.run_id }}
          path: |
            shorts_bot/output/zipper_short.mp4
            shorts_bot/output/plan.json
            shorts_bot/output/youtube_result.json
            shorts_bot/output/render.log
          if-no-files-found: warn
          retention-days: 7
