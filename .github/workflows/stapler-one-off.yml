name: Original Stapler Mechanism Short
on:
  push:
    branches: [main]
    paths:
      - shorts_bot/mechanism_request_stapler.json
permissions:
  contents: read
concurrency:
  group: original-stapler-one-off
  cancel-in-progress: false
jobs:
  create-and-publish:
    if: github.repository == 'averelliq/averelliq.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MECHANISM_VISION_MODEL: gemini-3.5-flash-lite
      TTS_VOICE: am_michael
      ZIPPER_ONE_OFF_PUBLISH: '1'
      MECHANISM_PUBLISH: '1'
      MECHANISM_TOPIC: stapler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install render and speech dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          python -m pip install -r shorts_bot/requirements.txt pillow
          python -m pip check
      - name: Validate mechanism drawing and photographic production code
        run: |
          python -m py_compile shorts_bot/two_mechanisms.py shorts_bot/zipper_short.py shorts_bot/mechanism_photo_entry.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'shorts_bot')
          import two_mechanisms as m
          import mechanism_photo_entry as photos
          assert sum(len(s[1].split()) for s in m.STAPLER)>=65
          img=m.make_frame('stapler')(16,28,[i*3.5 for i in range(9)])
          assert img.size==(540,960) and photos.MIN_APPROVED>=4
          print('Stapler animation and photo-required entrypoint validated')
          PY
      - name: Require verified real photographs, render MP4, inspect encoded scenes and publish
        run: python shorts_bot/mechanism_photo_entry.py
      - name: Preserve MP4 and verified upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-stapler-${{ github.run_id }}
          path: |
            shorts_bot/output/zipper_short.mp4
            shorts_bot/output/plan.json
            shorts_bot/output/youtube_result.json
            shorts_bot/output/render.log
          if-no-files-found: warn
          retention-days: 7
