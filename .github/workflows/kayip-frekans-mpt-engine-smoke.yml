name: KAYIP FREKANS - MoneyPrinterTurbo Gercek Motor Testi
on:
  push:
    paths:
      - kayip_frekans/mpt_engine_smoke.py
      - .github/workflows/kayip-frekans-mpt-engine-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: kf-mpt-engine-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render-real-mpt:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free media test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Download the previously user-approved tok AUDITION only
        uses: actions/download-artifact@v4
        with:
          run-id: '35222626464'
          name: KAYIP-FREKANS-V6-REFERANS-SES-TESTI
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: input/audio
      - name: Fetch the audited MIT MoneyPrinterTurbo engine
        run: |
          mkdir -p upstream/MoneyPrinterTurbo
          git -C upstream/MoneyPrinterTurbo init
          git -C upstream/MoneyPrinterTurbo remote add origin https://github.com/harry0703/MoneyPrinterTurbo.git
          git -C upstream/MoneyPrinterTurbo fetch --depth 1 --filter=blob:none origin 633dbb0cf6866e817a023f30c5ac20c6cf3f76de
          git -C upstream/MoneyPrinterTurbo checkout --detach FETCH_HEAD
          test "$(git -C upstream/MoneyPrinterTurbo rev-parse HEAD)" = '633dbb0cf6866e817a023f30c5ac20c6cf3f76de'
          test -f upstream/MoneyPrinterTurbo/LICENSE
      - uses: astral-sh/setup-uv@v6
      - name: Install MoneyPrinterTurbo open-source dependencies
        run: |
          cd upstream/MoneyPrinterTurbo
          uv sync --frozen --no-dev
      - name: Actually render a short MP4 with MPT and the SHA-pinned tok WAV
        timeout-minutes: 40
        run: |
          cd upstream/MoneyPrinterTurbo
          uv run --frozen python "$GITHUB_WORKSPACE/kayip_frekans/mpt_engine_smoke.py" \
            --workspace "$GITHUB_WORKSPACE" \
            --upstream "$GITHUB_WORKSPACE/upstream/MoneyPrinterTurbo" \
            --audio "$GITHUB_WORKSPACE/input/audio/serkan-v6-2-tok.wav"
      - name: Save ONLY technical test video and report; NEVER auto-publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAYIP-FREKANS-MPT-GERCEK-MOTOR-TESTI-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0
          path: |
            output/mpt-engine-smoke/smoke_result.json
            upstream/MoneyPrinterTurbo/storage/tasks/**/*.mp4
