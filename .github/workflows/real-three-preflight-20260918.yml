name: Real Footage Three Shorts Preflight (NO UPLOAD)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/real-three-preflight-20260918.yml

permissions:
  contents: read

jobs:
  find-real-clips:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_PRIVACY: public
      SHORTS_SKIP_UPLOAD: '0'
      REAL_SHORTS_PREFLIGHT_ONLY: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install light metadata check dependencies
        run: pip install requests numpy soundfile
      - name: Verify syntax and inspect three subjects' real portrait footage
        run: |
          python -m py_compile shorts_bot/real_three_20260918.py shorts_bot/montage_fx.py shorts_bot/quality_entry.py shorts_bot/selection_guard.py
          python shorts_bot/real_three_20260918.py
