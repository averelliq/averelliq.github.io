name: Shorts Bot Code Checks (No Upload)

on:
  push:
    branches: [main]
    paths:
      - shorts_bot/footage_first.py
      - shorts_bot/montage_entry.py
      - shorts_bot/tests/test_footage_first.py
      - .github/workflows/shorts-code-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight import dependencies
        run: python -m pip install requests numpy soundfile
      - name: Compile all bot Python sources
        run: python -m compileall -q shorts_bot
      - name: Check production imports without starting generator
        run: PYTHONPATH=shorts_bot python -c 'import footage_first, montage_entry; print("Production imports OK; no upload")'
      - name: Run offline footage-first tests
        run: python -m unittest discover -s shorts_bot/tests -p 'test_footage_first.py' -v
