name: Launch Remaining Two Public Shorts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/launch-three.yml

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.theme }} Short
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        theme: [history, everyday]
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: public
      GEMINI_MODEL: gemini-3.6-flash
      TTS_VOICE: am_michael
      SHORTS_THEME: ${{ matrix.theme }}
      SHORTS_AI_REVIEW: '1'
      SHORTS_SKIP_UPLOAD: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - name: Cache AI model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r shorts_bot/requirements.txt
          pip check
      - name: Preflight checks
        run: |
          python -m py_compile shorts_bot/main.py shorts_bot/retry_runner.py shorts_bot/upgrade.py shorts_bot/retry_editorial.py
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python - <<'PY'
          import requests, soundfile
          from kokoro import KPipeline
          print('Python imports OK')
          PY
      - name: Create and publish public Short
        run: python shorts_bot/retry_editorial.py
      - name: Save generated Short for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-${{ matrix.theme }}-${{ github.run_id }}
          path: |
            shorts_bot/output/short.mp4
            shorts_bot/output/plan.json
            shorts_bot/output/visual_sources.json
          if-no-files-found: ignore
          retention-days: 3
