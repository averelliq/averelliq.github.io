name: One-off Three Live-Action Global Shorts 2026-09-18

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneoff-three-real-shorts-20260918.yml

permissions:
  contents: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  publish-three-filmed-shorts:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: public
      SHORTS_SKIP_UPLOAD: '0'
      REAL_SHORTS_PREFLIGHT_ONLY: '0'
      GEMINI_MODEL: gemini-2.5-flash
      TTS_VOICE: am_michael
      SHORTS_MAX_VISUAL_CANDIDATES: '9'
      SHORTS_MUSIC: '1'
      SHORTS_MUSIC_GAIN: '0.16'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install free narration and real-video editing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          pip install -r shorts_bot/requirements.txt
          pip check
          python -m py_compile shorts_bot/main.py shorts_bot/real_three_20260918.py shorts_bot/real_three_live_launch_20260918.py shorts_bot/live_action_guard.py shorts_bot/visual_guard.py shorts_bot/selection_guard.py shorts_bot/quality_entry.py shorts_bot/montage_fx.py
      - name: Check three subjects and verify illustrated stock is rejected
        run: |
          PYTHONPATH=shorts_bot python - <<'PY'
          import live_action_guard as g
          import real_three_20260918 as r
          import visual_guard as v
          r.validate()
          assert len({p['topic'] for p in r.PLANS}) == 3
          assert all(len(p['scenes']) == 3 for p in r.PLANS)
          # Independent regression check: an illustrated candidate is NOT accepted.
          original = v.review_candidate
          original_verify = g._verify
          try:
              v.review_candidate = lambda *args: (True, 'semantic match')
              g._verify = lambda *args: (_ for _ in ()).throw(g.NotLiveFootage('illustration rejected'))
              g.install()
              from pathlib import Path
              from tempfile import TemporaryDirectory
              with TemporaryDirectory() as folder:
                  p=Path(folder)
                  for i in range(3): (p / f'candidate_00_{i}.jpg').write_bytes(b'fake frame')
                  assert v.review_candidate({},p,p,0) == (False, 'illustration rejected')
          finally:
              v.review_candidate = original
              g._verify = original_verify
              v._live_action_installed = False
          print('PASS: three unique subjects and cartoon rejection; no uploads during test',flush=True)
          PY
      - name: Render three real-footage MP4s, review ALL, then upload three public Shorts
        run: |
          test "$YOUTUBE_PRIVACY" = public
          test "$SHORTS_SKIP_UPLOAD" = 0
          test "$REAL_SHORTS_PREFLIGHT_ONLY" = 0
          python shorts_bot/real_three_live_launch_20260918.py
      - name: Preserve actual produced videos and footage provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-three-shorts-${{ github.run_id }}
          path: |
            shorts_bot/real_three_output_20260918/*/short.mp4
            shorts_bot/real_three_output_20260918/*/plan.json
            shorts_bot/real_three_output_20260918/*/visual_sources.json
          if-no-files-found: ignore
          retention-days: 5
