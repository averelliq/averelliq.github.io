name: KAYIP FREKANS - 17 Dakika Final Kurtarma
on:
  push:
    paths:
      - .github/workflows/kayip-frekans-final-rescue.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  final-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Yalnizca render araclarini kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install Pillow==11.3.0
      - name: Hazir 17 dakikalik tek ses dosyasini ve altyaziyi getir
        uses: actions/download-artifact@v4
        with:
          name: KAYIP-FREKANS-15MIN-ANALIZ-FINAL
          repository: averelliq/averelliq.github.io
          run-id: 35213771336
          github-token: ${{ github.token }}
          path: output
      - name: Ses ve zamanlama on kontrol
        run: |
          test -s output/narration.wav
          test -s output/state.json
          test -s output/captions.srt
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          state=json.loads(Path('output/state.json').read_text(encoding='utf-8'))
          seconds=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1','output/narration.wav'],text=True))
          assert 900 <= seconds <= 1200, f'Beklenmeyen sure: {seconds}'
          assert abs(float(state['total'])-seconds)<1, 'State ve ses suresi farkli'
          assert len(state['segments']) >= 25, 'Sahne plani eksik'
          print(f'HAZIR: {seconds:.2f} saniye, {len(state["segments"])} planlanmis sahne, tek ses.', flush=True)
          PY
      - name: Tek mevcut ses ile 1080p video render
        timeout-minutes: 105
        run: |
          python -u -c "import sys; sys.path.insert(0,'kayip_frekans'); import cloud_v3 as v3; v3.FPS=15; import cloud_v4; v3.main()" --stage render
      - name: Final MP4 teknik dogrulama
        if: success()
        run: |
          test -s output/final.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height -of json output/final.mp4
          python - <<'PY'
          import json, subprocess
          p=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json','output/final.mp4']))
          v=next(s for s in p['streams'] if s['codec_type']=='video')
          assert (v['width'],v['height'])==(1920,1080), '1080p degil'
          assert any(s['codec_type']=='audio' for s in p['streams']), 'Ses yok'
          assert 900<=float(p['format']['duration'])<=1200, '15-20 dakika degil'
          print('DOGRULANDI: 1080p, ses+goruntu, 15-20 dakika.',flush=True)
          PY
      - name: Final video ve analiz dosyalarini kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAYIP-FREKANS-17DK-VIDEO-VE-ANALIZ
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
          path: |
            output/final.mp4
            output/thumbnail.jpg
            output/story.txt
            output/story_only.txt
            output/intro.txt
            output/captions.srt
            output/metadata.json
            output/validation.json
            output/quality_report.json
            output/voice_pipeline.json
            output/narration.wav
            output/scene_plan.json
            output/shots.json
            output/visual_sources.json
            output/credits.txt
            output/state.json
