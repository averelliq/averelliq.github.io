name: Correct 3D Printer Short Preview

on:
  push:
    paths:
      - 'shorts_bot/three_d_final_request.json'

permissions:
  contents: read

jobs:
  genuine-3d-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHORTS_BATCH_TOPIC: 3d-printer
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TTS_VOICE: am_michael
      SHORTS_SKIP_UPLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
          pip install -r shorts_bot/requirements.txt
          pip check
          python -m py_compile shorts_bot/three_d_final_preview.py
      - name: Render only verified HD printer footage; never auto-upload
        run: PYTHONPATH=shorts_bot python -u shorts_bot/three_d_final_preview.py
      - name: Preserve original MP4 and 21 review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3d-original-${{ github.run_id }}
          path: |
            shorts_bot/output/short.mp4
            shorts_bot/output/plan.json
            shorts_bot/output/visual_sources.json
            shorts_bot/output/scene_*.jpg
            shorts_bot/output/manual_review_required.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
