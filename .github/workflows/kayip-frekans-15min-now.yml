name: KAYIP FREKANS - 15 Dakika Analiz Videosu
on:
  push:
    paths:
      - .github/workflows/kayip-frekans-15min-now.yml
permissions:
  contents: read
jobs:
  full-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TARGET_MINUTES: '15'
      SHORT_TEST: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ses ve video araclarini kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r kayip_frekans/requirements.txt
          pip install --no-deps openvoice-cli==0.0.5
      - name: Analiz icin 15 dakikalik hikayeyi hazirla
        run: python -u kayip_frekans/fixed_15_story.py
      - name: Tek parca Serkan anlatimi
        timeout-minutes: 90
        run: python -u kayip_frekans/cloud_v4.py --stage narration
      - name: 1080p videoyu render et
        timeout-minutes: 60
        run: python -u kayip_frekans/cloud_v4.py --stage render
      - name: Ciktilari yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAYIP-FREKANS-15MIN-ANALIZ
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
          path: |
            output/final.mp4
            output/thumbnail.jpg
            output/story.txt
            output/story_only.txt
            output/intro.txt
            output/captions.srt
            output/metadata.json
            output/validation.json
            output/quality_report.json
            output/voice_pipeline.json
            output/narration.wav
            output/scene_plan.json
            output/shots.json
            output/visual_sources.json
            output/credits.txt
            output/state.json
