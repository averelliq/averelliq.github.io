name: Global Shorts VPN single upload

on:
  workflow_dispatch:
    inputs:
      theme:
        description: Video theme
        required: true
        type: choice
        options:
          - auto
          - science
          - history
          - everyday
        default: auto

permissions:
  contents: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  create-short-via-vpn:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VPN_WG_CONFIG: ${{ secrets.SHORTS_WG_CONFIG }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_DATA_API_KEY: ${{ secrets.YT_DATA_API_KEY }}
      YOUTUBE_PRIVACY: public
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_FALLBACK_MODELS: gemini-3.5-flash,gemini-3.6-flash
      TTS_VOICE: am_michael
      SHORTS_THEME: ${{ inputs.theme }}
      SHORTS_AI_REVIEW: '1'
      SHORTS_TREND_MODE: auto
      SHORTS_US_TRENDS: '1'
      SHORTS_MAX_VISUAL_CANDIDATES: '9'
      SHORTS_MUSIC: '1'
      SHORTS_MUSIC_GAIN: '0.20'
      SHORTS_SKIP_UPLOAD: '0'
    steps:
      - name: Require configured VPN before any generation or upload
        run: |
          if [ -z "$VPN_WG_CONFIG" ]; then
            echo 'VPN not configured: add a trusted WireGuard .conf profile as encrypted GitHub Actions secret SHORTS_WG_CONFIG. No video will be generated or uploaded.' >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WireGuard and media requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools openresolv ffmpeg espeak-ng libsndfile1 curl

      - name: Establish and verify full-tunnel VPN
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          before="$(curl -4fsS --max-time 20 https://api.ipify.org)"
          sudo install -d -m 700 /etc/wireguard
          printf '%s\n' "$VPN_WG_CONFIG" | sudo tee /etc/wireguard/wgshorts.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wgshorts.conf
          if ! sudo grep -Eq '^[[:space:]]*AllowedIPs[[:space:]]*=[[:space:]]*0\.0\.0\.0/0' /etc/wireguard/wgshorts.conf; then
            echo 'A full IPv4 tunnel (AllowedIPs = 0.0.0.0/0) is required. Upload cancelled.' >&2
            exit 1
          fi
          sudo wg-quick up wgshorts
          sudo wg show wgshorts >/dev/null
          after="$(curl -4fsS --max-time 20 https://api.ipify.org)"
          if [ -z "$after" ] || [ "$after" = "$before" ]; then
            echo 'VPN public IPv4 was not changed. Upload cancelled.' >&2
            exit 1
          fi
          if ! ip -4 route get 1.1.1.1 | grep -q 'dev wgshorts'; then
            echo 'Traffic is not routed through wgshorts. Upload cancelled.' >&2
            exit 1
          fi
          echo 'Verified: WireGuard connected and IPv4 egress changed (addresses not logged).'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt

      - name: Cache AI model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r shorts_bot/requirements.txt
          pip check

      - name: Preflight checks
        run: |
          python -m py_compile shorts_bot/main.py shorts_bot/retry_runner.py shorts_bot/upgrade.py shorts_bot/editorial_upgrade.py shorts_bot/selection_guard.py shorts_bot/visual_guard.py shorts_bot/live_action_guard.py shorts_bot/trend_ideas.py shorts_bot/us_trends.py shorts_bot/us_window.py shorts_bot/quality_entry.py shorts_bot/montage_fx.py shorts_bot/montage_entry.py shorts_bot/gemini_transient_guard.py
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Generate, quality-check and upload exactly one original Short
        run: python shorts_bot/montage_entry.py

      - name: Save generated Short for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-short-${{ github.run_id }}
          path: |
            shorts_bot/output/short.mp4
            shorts_bot/output/plan.json
            shorts_bot/output/visual_sources.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Disconnect VPN
        if: always()
        run: |
          if sudo test -f /etc/wireguard/wgshorts.conf; then
            sudo wg-quick down wgshorts || true
            sudo rm -f /etc/wireguard/wgshorts.conf
          fi
