name: Global Shorts free WARP single upload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/global-shorts-vpn-once.yml'
  workflow_dispatch:
    inputs:
      theme:
        description: Video theme
        required: true
        type: choice
        options:
          - auto
          - science
          - history
          - everyday
        default: auto
      smoke_test:
        description: Test VPN and create a video without publishing
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  create-short-via-free-warp:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_DATA_API_KEY: ${{ secrets.YT_DATA_API_KEY }}
      YOUTUBE_PRIVACY: public
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_FALLBACK_MODELS: gemini-3.5-flash,gemini-3.6-flash
      TTS_VOICE: am_michael
      SHORTS_THEME: ${{ inputs.theme || 'auto' }}
      SHORTS_AI_REVIEW: '1'
      SHORTS_TREND_MODE: auto
      SHORTS_US_TRENDS: '1'
      SHORTS_MAX_VISUAL_CANDIDATES: '9'
      SHORTS_MUSIC: '1'
      SHORTS_MUSIC_GAIN: '0.20'
      SHORTS_SKIP_UPLOAD: ${{ github.event_name == 'push' && '0' || (inputs.smoke_test && '1' || '0') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt

      - name: Cache AI model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1

      - name: Install video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 curl gnupg ca-certificates
          python -m pip install --upgrade pip
          pip install -r shorts_bot/requirements.txt
          pip check

      - name: Check production code
        run: |
          python -m py_compile shorts_bot/main.py shorts_bot/retry_runner.py shorts_bot/upgrade.py shorts_bot/editorial_upgrade.py shorts_bot/selection_guard.py shorts_bot/visual_guard.py shorts_bot/live_action_guard.py shorts_bot/trend_ideas.py shorts_bot/us_trends.py shorts_bot/us_window.py shorts_bot/quality_entry.py shorts_bot/montage_fx.py shorts_bot/montage_entry.py shorts_bot/gemini_transient_guard.py
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install official free Cloudflare WARP client
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ ${VERSION_CODENAME} main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo systemctl start warp-svc

      - name: Connect and verify WARP full VPN tunnel
        shell: bash
        run: |
          set -euo pipefail
          before="$(curl -4fsS --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | sed -n 's/^ip=//p' | head -n 1)"
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp+doh
          warp-cli --accept-tos connect
          connected=0
          for attempt in $(seq 1 12); do
            trace="$(curl -4fsS --max-time 12 https://www.cloudflare.com/cdn-cgi/trace || true)"
            if printf '%s\n' "$trace" | grep -qx 'warp=on'; then
              after="$(printf '%s\n' "$trace" | sed -n 's/^ip=//p' | head -n 1)"
              if [ -n "$before" ] && [ -n "$after" ] && [ "$before" != "$after" ]; then
                connected=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$connected" != 1 ]; then
            echo 'Free WARP was not verified or public IP did not change; do not upload.' >&2
            exit 1
          fi
          echo 'Free WARP verified: warp=on and public IPv4 changed. IP values withheld.'

      - name: Generate, quality-check and optionally upload one Short
        run: python shorts_bot/montage_entry.py

      - name: Save output and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-warp-short-${{ github.run_id }}
          path: |
            shorts_bot/output/short.mp4
            shorts_bot/output/plan.json
            shorts_bot/output/visual_sources.json
          if-no-files-found: ignore
          retention-days: 3