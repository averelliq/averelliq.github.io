name: One Original Viral-Style Sunset Short — Corrected Footage — 2026-09-18

on:
  push:
    paths:
      - .github/workflows/one-original-viral-sunset-corrected-20260918.yml

permissions:
  contents: read

concurrency:
  group: global-shorts-bot
  cancel-in-progress: false

jobs:
  sunset:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: public
      SHORTS_SKIP_UPLOAD: '0'
      GEMINI_MODEL: gemini-3.5-flash-lite
      TTS_VOICE: am_michael
      SHORTS_MAX_VISUAL_CANDIDATES: '9'
      SHORTS_MUSIC: '1'
      SHORTS_MUSIC_GAIN: '0.16'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout unique safe-retry workflow
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shorts_bot/requirements.txt
      - name: Cache narrator
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - name: Install free narration and filmed editing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          pip install -r shorts_bot/requirements.txt
          pip check
          python -m py_compile shorts_bot/one_viral_sunset_corrected_20260918.py shorts_bot/two_original_shorts_20260918.py shorts_bot/montage_fx.py shorts_bot/live_action_guard.py shorts_bot/quality_entry.py shorts_bot/safe_captions.py
      - name: Validate corrected original narration and mobile subtitles without upload
        run: |
          PYTHONPATH=shorts_bot python - <<'PY'
          import one_viral_sunset_corrected_20260918 as s
          import two_original_shorts_20260918 as pair
          pair.PLANS['viral']['scenes'][2].update(voiceover='Near sunset, the Sun sits low in the sky. Its light travels through more air.',query='sunset horizon clouds',backup_queries=['orange sunset sky','sun low horizon'],caption='Light travels farther')
          pair.verify_script(pair.PLANS['viral'])
          print('PASS: corrected original sunset narration and safe captions; NO UPLOAD IN TEST',flush=True)
          PY
      - name: Inspect five distinct genuine landscape shots and publish one sunset Short
        run: python shorts_bot/one_viral_sunset_corrected_20260918.py
      - name: Keep original rendered MP4 and visual proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-original-viral-${{ github.run_id }}
          path: |
            shorts_bot/two_original_viral_output_20260918/short.mp4
            shorts_bot/two_original_viral_output_20260918/plan.json
            shorts_bot/two_original_viral_output_20260918/visual_sources.json
            shorts_bot/two_original_viral_work_20260918/captions.ass
          if-no-files-found: ignore
          retention-days: 5
