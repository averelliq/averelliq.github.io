name: KAYIP FREKANS - V8.1 ONE TIME LAUNCH
on:
  push:
    paths:
      - '.github/workflows/kayip-frekans-v8-1-once.yml'
permissions:
  actions: write
  contents: read
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one updated long-video review run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/kayip-frekans-mpt-long-serious.yml/dispatches" \
            -f ref=main \
            -f 'inputs[topic]=Köyde yalnız kalan bir adam, ölen kardeşinin sesini kilitli dış kapıdan ve sonra evin içinden duyar. Eski aile eşyası, komşu tanıklığı ve önceden verilen ipuçları finalde birleşir. Kamu malı klasik korku eserinden Türkçe cinli uyarlama; gerçek yaşanmış olay diye sunulmaz.' \
            -f 'inputs[target_minutes]=15'
          echo 'One corrected KAYIP FREKANS long-video run dispatched; YouTube upload disabled.'
