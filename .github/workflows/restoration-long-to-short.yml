name: Restoration Shorts - Full video to 60 seconds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional GitHub Release tag containing your original video"
        required: false
        default: ""
        type: string
      source_url:
        description: "Optional publicly accessible DIRECT HTTPS video file URL (not a webpage)"
        required: false
        default: ""
        type: string
      video_asset:
        description: "Release asset filename pattern, when using a release"
        required: false
        default: "*.mp4"
        type: string
      narration:
        description: "Optional accurate English narration for this video"
        required: false
        default: ""
        type: string
      subtitle_box:
        description: "Optional source-pixel text rectangle x:y:width:height, or none"
        required: false
        default: "none"
        type: string
  release:
    types: [published]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: restoration-long-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  make-short:
    # Public issues can be opened by anyone: process ONLY issues created by the repo owner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'restoration-input-')) ||
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'RESTORATION VIDEO:'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || '' }}
      SOURCE_URL: ${{ inputs.source_url || '' }}
      ISSUE_BODY: ${{ github.event.issue.body || '' }}
      VIDEO_ASSET: ${{ inputs.video_asset || '*.mp4' }}
      NARRATION: ${{ inputs.narration || '' }}
      SUBTITLE_BOX: ${{ inputs.subtitle_box || 'none' }}
    steps:
      - name: 01 - Check out bot source
        uses: actions/checkout@v4
      - name: 02 - Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 03 - Install free video and English speech tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r restoration-shorts-bot/long_requirements.txt
      - name: 04 - Run source-order and subtitle-box checks
        run: python -m unittest discover -s restoration-shorts-bot/tests -p 'test_long_to_short.py' -v
      - name: 05 - Get one source video from owner URL or GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming output
          if [[ "$GITHUB_EVENT_NAME" == "issues" ]]; then
            SOURCE_URL="$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^VIDEO_URL=//p' | head -n 1)"
          fi
          if [[ -n "$SOURCE_URL" ]]; then
            if [[ -n "$RELEASE_TAG" ]]; then
              echo 'Supply a source URL OR a release tag, not both.' >&2
              exit 1
            fi
            case "$SOURCE_URL" in
              https://*) ;;
              *) echo 'A direct HTTPS video URL is required.' >&2; exit 1 ;;
            esac
            # This URL is provided by the repository owner; it must serve video bytes without login.
            curl --fail --location --retry 2 --connect-timeout 20 --max-time 600 --max-filesize 1500000000 --output incoming/source.mp4 "$SOURCE_URL"
          elif [[ -n "$RELEASE_TAG" ]]; then
            gh release download "$RELEASE_TAG" --pattern "$VIDEO_ASSET" --dir incoming
          else
            echo 'No video provided: send a direct HTTPS URL or attach an MP4 to a release.' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          paths = [p for p in Path('incoming').rglob('*') if p.is_file() and p.suffix.lower() in {'.mp4','.mov','.mkv','.webm','.m4v'}]
          if len(paths) != 1 or paths[0].stat().st_size < 1024:
              raise SystemExit(f'Expected one nonempty source video; found {len(paths)}.')
          print('Received one video:', paths[0].name, 'size:', paths[0].stat().st_size)
          PY
      - name: 06 - Process ALL source footage chronologically, narrate and verify
        shell: bash
        run: |
          set -euo pipefail
          source_file="$(find incoming -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.m4v' \) -print -quit)"
          args=(--input "$source_file" --output output/restoration_short.mp4 --report output/report.json --subtitle-box "$SUBTITLE_BOX")
          if [[ -n "$NARRATION" ]]; then
            args+=(--narration "$NARRATION")
          fi
          python restoration-shorts-bot/long_to_short.py "${args[@]}"
      - name: 07 - Save finished MP4 and stage-by-stage QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restoration-short-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
