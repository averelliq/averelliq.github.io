name: Trend Discovery Auth Tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trend-auth-tests.yml
      - shorts_bot/trend_ideas.py
      - shorts_bot/test_trend_auth.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test auth and safe fallback without Google secrets or uploading
        run: |
          pip install requests==2.34.2
          python -m py_compile shorts_bot/trend_ideas.py shorts_bot/test_trend_auth.py
          python -m unittest discover -s shorts_bot -p 'test_trend_auth.py' -v
