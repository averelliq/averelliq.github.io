name: Stapler Photo Quality Preview (No YouTube Upload)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/mechanism-photo-preview.yml
      - shorts_bot/mechanism_photo_entry.py
permissions:
  contents: read
jobs:
  visual-preflight:
    if: github.repository == 'averelliq/averelliq.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MECHANISM_VISION_MODEL: gemini-2.5-flash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install preview prerequisites only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install 'requests>=2.31,<3' 'pillow>=10,<13' 'numpy>=1.26,<3' 'soundfile>=0.12,<1'
      - name: Fetch and verify actual photo sources and render representative frames without publishing
        run: |
          PYTHONPATH=shorts_bot python - <<'PY'
          import json
          from pathlib import Path
          import mechanism_photo_entry as entry
          entry._photos = entry._prepare('stapler')
          frame = entry._compose('stapler')
          boundaries = [i * 3.75 for i in range(9)]
          output = Path('shorts_bot/output')
          output.mkdir(exist_ok=True)
          for scene in (0, 3, 6):
              image = frame(scene * 3.75 + 1, 30, boundaries)
              assert image.size == (540, 960)
              image.save(output / f'stapler_photo_preview_{scene + 1}.jpg', quality=85)
          (output / 'preview_photo_sources.json').write_text(json.dumps([
              {k: photo[k] for k in ('id','source','photographer','visible_subject')}
              for photo in entry._photos], indent=2), encoding='utf-8')
          print('LIVE VISUAL PREFLIGHT PASSED: photo-backed frames generated; no YouTube upload', flush=True)
          PY
      - name: Save photographic preview and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stapler-real-photo-preview-${{ github.run_id }}
          path: |
            shorts_bot/output/stapler_photo_preview_*.jpg
            shorts_bot/output/preview_photo_sources.json
          if-no-files-found: warn
          retention-days: 7
