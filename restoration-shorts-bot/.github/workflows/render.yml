name: Render approved restoration Short
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Approved manifest filename, e.g. approved/my-restoration.json'
        required: true
        type: string
      upload_private:
        description: 'Upload as PRIVATE after rendering (never public automatically)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: restoration-shorts-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      - name: Render, optionally upload privately
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MANIFEST: ${{ inputs.manifest }}
          UPLOAD_PRIVATE: ${{ inputs.upload_private }}
        run: |
          if [ "$UPLOAD_PRIVATE" = 'true' ]; then
            python bot.py render --manifest "$MANIFEST" --upload-private
          else
            python bot.py render --manifest "$MANIFEST"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restoration-preview
          path: |
            restoration-shorts-bot/output/short.mp4
            restoration-shorts-bot/output/script.txt
            restoration-shorts-bot/output/source-info.json
          if-no-files-found: warn
          retention-days: 7
