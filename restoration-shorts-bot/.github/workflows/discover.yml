name: Discover licensed footage
on:
  workflow_dispatch:
  schedule:
    - cron: '20 8 * * *'
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: restoration-shorts-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Find Pexels candidates only
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python bot.py discover
      - uses: actions/upload-artifact@v4
        with:
          name: review-candidates
          path: restoration-shorts-bot/output/candidates.json
          retention-days: 7
